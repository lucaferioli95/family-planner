<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Meal Planner</title>
<meta name="description" content="Weekly meal planner, recipes, nutrition tracking, and shopping list for the family.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3F5539">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Planner">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body style="margin:0;">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap');

.mp {
  /* Shared with the Ricettario: enamel blue ink on chalk, one brass accent.
     The old names are kept so three hundred rules do not have to change. */
  --paper: #FFFFFF;
  --surface: #F1EFE9;
  --card: #FFFFFF;
  --chalk: #F7F6F2;
  --ink: #1F3A4D;
  --ink-soft: #5A7383;
  --sage: #B5832F;        /* the accent: what you are meant to press */
  --sage-deep: #8A6520;
  --brass: #B5832F;
  --gold: #B5832F;
  --gold-soft: #F6EEDC;
  --brick: #9C3B22;
  --brick-soft: #F3E0DA;
  --amber: #9A6508;
  --line: #DFDBD2;
  --rule-soft: #ECE9E2;
  /* Nutrition keeps three states — they mean something, so they stay apart
     from the accent. Muted to sit on chalk rather than on white. */
  --ok: #3D6B4A;
  --warn: #9A6508;
  --low: #9C3B22;
  /* Seven days, each still its own colour, but used as a rule and a name
     rather than a wash across the whole column. */
  --day-mon-bg: #EAF1F8; --day-mon-text: #2B5E86;
  --day-tue-bg: #F9E9EE; --day-tue-text: #9C3A60;
  --day-wed-bg: #FAF1DC; --day-wed-text: #8A6520;
  --day-thu-bg: #E8F1E9; --day-thu-text: #3D6B4A;
  --day-fri-bg: #FAEBE2; --day-fri-text: #A1552A;
  --day-sat-bg: #EFEAF6; --day-sat-text: #6B5191;
  --day-sun-bg: #E4F0EF; --day-sun-text: #1F6B6B;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(38,43,34,0.06), 0 4px 14px rgba(38,43,34,0.06);
  background: var(--chalk);
  color: var(--ink);
  font-family: 'Karla', system-ui, sans-serif;
  padding: 0 20px 60px;
  border-radius: 16px;
  min-height: 100%;
}
.mp * { box-sizing: border-box; }
.mp h1, .mp h2, .mp h3, .mp h4 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.mp button { font-family: inherit; cursor: pointer; }
.mp input, .mp select, .mp textarea { font-family: 'Karla', system-ui, sans-serif; }
.mp :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.mp-day-mon { --accent-bg: var(--day-mon-bg); --accent-text: var(--day-mon-text); }
.mp-day-tue { --accent-bg: var(--day-tue-bg); --accent-text: var(--day-tue-text); }
.mp-day-wed { --accent-bg: var(--day-wed-bg); --accent-text: var(--day-wed-text); }
.mp-day-thu { --accent-bg: var(--day-thu-bg); --accent-text: var(--day-thu-text); }
.mp-day-fri { --accent-bg: var(--day-fri-bg); --accent-text: var(--day-fri-text); }
.mp-day-sat { --accent-bg: var(--day-sat-bg); --accent-text: var(--day-sat-text); }
.mp-day-sun { --accent-bg: var(--day-sun-bg); --accent-text: var(--day-sun-text); }

/* The header and the tabs travel together and stay pinned, so the week is
   always one tap away however far down the page you are. Before, a banner at
   the top could push the tabs off screen entirely. */
.mp-topbar { position: sticky; top: 0; z-index: 60; background: var(--chalk); margin: 0 -20px 16px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.mp-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 10px; }
/* Arriving, the name is worth a moment. Once you are reading, it is worth a
   sliver — the tabs and the week are what you came back up for. The class
   lives on <body> because the app rebuilds everything inside #mp-root. */
.mp-header, .mp-title { transition: padding .18s ease, font-size .18s ease; }
body.mp-scrolled .mp-header { padding: 7px 0 5px; }
body.mp-scrolled .mp-title { font-size: 14px; color: var(--ink-soft); }
body.mp-scrolled .mp-tab { padding-top: 5px; }
@media (prefers-reduced-motion: reduce) { .mp-header, .mp-title { transition: none; } }
.mp-brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.mp-mark { width: 30px; height: 30px; flex: none; border-radius: 8px; display: block; }
.mp-title { font-size: 25px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; color: var(--ink); line-height: 1.1; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mp-save-status:empty { display: none; }
.mp-save-status { font-size: 12px; padding: 4px 9px; border-radius: 20px; background: none; border: 1px solid transparent; color: var(--ink-soft); white-space: nowrap; }
.mp-save-status.saved { color: var(--ink-soft); }
.mp-save-status.saving, .mp-save-status.pending { color: var(--brass); }
.mp-save-status.error { color: var(--brick); border-color: var(--brick); }
.mp-save-status.error:hover { background: var(--brick-soft); }
.mp-toast { background: var(--ink); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 8px; margin-bottom: 14px; display: inline-block; }

.mp-tabs { display: flex; gap: 2px; margin: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.mp-tabs::-webkit-scrollbar { display: none; }
.mp-tab { background: none; border: none; padding: 8px 9px 10px; font-size: 13.5px; font-weight: 500; color: var(--ink-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .15s; }
.mp-tab:hover { color: var(--ink); }
.mp-tab.active { color: var(--ink); border-bottom-color: var(--brass); font-weight: 600; }

.mp-empty { font-size: 13px; color: var(--ink-soft); font-style: italic; }

.mp-week-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.mp-week-select { flex: 1 1 180px; min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 13px; font-weight: 600; color: var(--ink); font-family: 'Karla', system-ui, sans-serif; }
.mp-week-tab-edit { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 9px 10px; font-size: 13px; font-weight: 600; color: var(--ink); flex: 1 1 180px; }
.mp-week-tab-actions { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mp-icon-btn { background: none; border: none; padding: 6px 7px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.mp-icon-btn:hover { color: var(--sage-deep); background: var(--surface); }
.mp-icon-btn.mp-confirm { color: #fff; background: var(--brick); font-weight: 600; font-size: 11px; padding: 6px 8px; }
.mp-icon-btn.mp-confirm:hover { background: var(--brick); color: #fff; }
.mp-nutrient-remove { background: none; border: none; color: var(--ink-soft); font-size: 13px; padding: 0 0 0 4px; }
.mp-nutrient-remove:hover { color: var(--brick); }
.mp-week-add { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--ink); font-weight: 500; }
.mp-week-add:hover { background: var(--card); border-color: var(--sage); }

.mp-days-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 18px 0 24px; align-items: stretch; }
@media (min-width: 700px)  { .mp-days-row { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1000px) { .mp-days-row { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1500px) { .mp-days-row { grid-template-columns: repeat(7, 1fr); gap: 10px; } }
/* No clipping: the three-dot menu is positioned inside a day, and on a short
   day — an empty one especially — a hidden overflow cut the menu in half. */
.mp-day-card { background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--accent-text, var(--line)); border-radius: var(--radius); padding: 0 14px 14px; box-shadow: none; display: flex; flex-direction: column; gap: 10px; }
/* A day with an open menu floats above its neighbours, so the menu is not
   painted underneath the next day along. */
.mp-day-card:has(.mp-meal-menu) { position: relative; z-index: 40; }
.mp-day-header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 0 9px; border-bottom: 1px solid var(--rule-soft); }
.mp-day-name { font-size: 17px; font-weight: 700; color: var(--accent-text, var(--sage-deep)); }
.mp-daytotal-icon { flex-shrink: 0; background: #fff; border: 1px solid var(--accent-text, var(--line)); color: var(--accent-text, var(--ink)); border-radius: 7px; width: 30px; height: 30px; font-size: 16px; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; }
.mp-daytotal-icon:hover { background: var(--surface); }

.mp-planner-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 4px 0 10px; }
.mp-toolbar-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.mp-guest-tag { font-size: 9px;  opacity: 0.75; font-weight: 700; }
.mp-daymeal-everyone { width: 100%; margin-top: 6px; border-style: dashed; }
.mp-person-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.mp-person-row { display: flex; align-items: center; gap: 8px; }
.mp-person-name-input { flex: 1 1 auto; min-width: 0; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: var(--ink); background: #fff; }
.mp-person-guest { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
.mp-person-guest input { width: 14px; height: 14px; accent-color: var(--sage-deep); }
.mp-person-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; margin: 0; }
.mp-person-toggle-btn { background: #fff; border: none; padding: 7px 18px; font-size: 12px; font-weight: 600; color: var(--ink-soft); font-family: 'Karla', system-ui, sans-serif; }
.mp-person-toggle-btn.active { background: var(--ink); color: var(--chalk); }

.mp-slot { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.mp-slot:first-of-type { padding-top: 0; border-top: none; }
.mp-slot-head { display: flex; flex-direction: column; gap: 4px; }
.mp-slot-name { font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--ink-soft); font-weight: 600; }

.mp-standalone-row { display: grid; grid-template-columns: 1fr 52px 26px 20px; gap: 4px; align-items: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 4px; }
.mp-standalone-row .mp-row { display: contents; }
.mp-standalone-row .mp-row-del { display: none; }
.mp-skip-btn { font-size: 12px; color: var(--line); flex-shrink: 0; }
.mp-skip-btn.mp-skip-active { color: #4A90D9; }
.mp-meal-block-skip { opacity: 0.72; }

.mp-empty-mini { font-size: 11px; color: var(--ink-soft); font-style: italic; margin: 0; padding: 6px 8px; }

.mp-daymeal-choices-stack { flex-direction: column; }
.mp-daymeal-choice-full { width: 100%; text-align: center; }

.mp-daymeal-card { max-width: 340px; text-align: left; }
.mp-daymeal-mode { justify-content: center; margin: 10px 0 4px; }
.mp-daymeal-card .mp-modal-title { text-align: center; margin-bottom: 4px; }
.mp-modal-step { text-align: center; font-size: 10px; letter-spacing: 0; color: var(--sage-deep); font-weight: 700; margin: 0 0 4px; }
.mp-daymeal-summary { text-align: center; font-size: 11px; color: var(--ink-soft); margin: 0 0 12px; }
.mp-daymeal-list { max-height: 160px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0 4px; }
.mp-daymeal-option { padding: 8px 10px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--line); }
.mp-daymeal-option:last-child { border-bottom: none; }
.mp-daymeal-option:hover { background: var(--surface); }
.mp-daymeal-selected { background: var(--gold-soft); font-weight: 600; }
.mp-daymeal-option-new { display: block; width: 100%; text-align: left; background: var(--gold-soft); font-weight: 600; color: var(--ink); border: none; border-bottom: 1px solid var(--line); border-radius: 0; font-family: inherit; }

.mp-daymeal-basket { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0 2px; background: #fff; }
.mp-basket-row { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; border-bottom: 1px solid var(--line); }
.mp-basket-row:last-child { border-bottom: none; }
.mp-basket-name { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; text-align: left; }
.mp-basket-qty { flex: 0 0 auto; display: flex; align-items: baseline; gap: 4px; }
.mp-basket-qty-input { width: 54px; text-align: right; font-family: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--chalk); color: var(--ink); }
.mp-basket-unit { font-size: 11px; color: var(--ink-soft); min-width: 18px; }
.mp-basket-tag { flex: 0 0 auto; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.mp-basket-remove { flex: 0 0 auto; }

.mp-modal-card.mp-tr-modal { max-width: 560px; width: 100%; text-align: left; display: flex; flex-direction: column; max-height: 88vh; }
.mp-tr-modal > .mp-modal-title, .mp-tr-modal > .mp-daymeal-summary, .mp-tr-modal > .mp-settings-note,
.mp-tr-modal > .mp-recipe-warning-note, .mp-tr-modal > .mp-suit-row, .mp-tr-modal > button { flex: 0 0 auto; }
.mp-tr-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; touch-action: pan-y; }
.mp-tr-row { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid var(--line); }
.mp-tr-row:last-child { border-bottom: none; }
.mp-tr-same { opacity: 0.55; }
.mp-tr-merge { background: var(--gold-soft); }
.mp-tr-tag-warn { color: var(--sage-deep); }
.mp-tr-old { flex: 1 1 40%; min-width: 0; font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-tr-arrow { flex: 0 0 auto; color: var(--ink-soft); font-size: 11px; }
.mp-tr-input { flex: 1 1 40%; min-width: 0; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink); padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--chalk); }
.mp-tr-unit { flex: 0 0 84px; min-width: 0; font-family: inherit; font-size: 12px; color: var(--ink-soft); padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--chalk); text-align: center; }
.mp-tr-tag { flex: 0 0 auto; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); font-weight: 700; }
@media (max-width: 560px) {
  .mp-tr-row { flex-wrap: wrap; }
  .mp-tr-old { flex: 1 1 100%; }
  .mp-tr-arrow { display: none; }
}
.mp-daymeal-label { font-size: 12px; letter-spacing: 0; color: var(--ink-soft); font-weight: 700; margin: 12px 0 6px; }
.mp-daymeal-choices { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.mp-daymeal-choice { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--ink); }
.mp-daymeal-choice:hover { background: var(--surface); color: var(--ink); }
.mp-daymeal-choice-selected:hover { background: var(--ink); color: var(--chalk); }
.mp-person-toggle-btn:hover { background: var(--surface); color: var(--ink); }
.mp-person-toggle-btn.active:hover { background: var(--ink); color: var(--chalk); }
.mp-daymeal-choice-selected { background: var(--ink); color: var(--chalk); border-color: var(--sage-deep); }
.mp-daymeal-day-btn { padding: 6px 10px; min-width: 42px; text-align: center; }
.mp-daymeal-add-btn { width: 100%; margin-top: 14px; }
.mp-daymeal-add-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.mp-meal-block { background: none; border: none; border-radius: 0; border-bottom: 1px solid var(--rule-soft); }
.mp-meal-block:last-child { border-bottom: none; }
.mp-meal-block-head { display: flex; align-items: center; gap: 6px; padding: 9px 2px; cursor: pointer; }
.mp-meal-block-head:hover .mp-meal-block-name { text-decoration: underline; text-underline-offset: 3px; }
.mp-meal-chevron { font-size: 9px; color: var(--ink-soft); width: 10px; flex-shrink: 0; margin-top: 4px; }
.mp-meal-block-name { flex: 1; font-size: 12px; font-weight: 600; color: var(--ink); min-width: 0; overflow-wrap: break-word; word-break: break-word; padding: 2px 0; }

.mp-modal-backdrop { position: fixed; inset: 0; background: rgba(38,43,34,0.45); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.mp-modal-card { background: #fff; border-radius: 14px; padding: 22px; max-width: 320px; width: 100%; max-height: 100%; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,0.2); text-align: center; }
.mp-modal-title { font-size: 15px; color: var(--ink); margin: 0 0 16px; line-height: 1.4; }
.mp-modal-btn { flex: 1; padding: 10px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font-size: 13px; font-weight: 600; }
.mp-modal-btn:hover { background: var(--surface); }
.mp-modal-btn-primary { background: var(--ink); color: var(--chalk); border-color: var(--sage-deep); }
.mp-modal-btn-primary:hover { background: #163041; }
.mp-modal-cancel { background: none; border: none; color: var(--ink-soft); font-size: 12px; padding: 4px; }
.mp-modal-cancel:hover { text-decoration: underline; }
.mp-meal-block-body { padding: 6px 8px 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.mp-slot-extras { display: flex; flex-direction: column; gap: 4px; }
.mp-hidden-toggle { align-self: flex-start; background: none; border: none; color: var(--ink-soft); font-size: 10px; font-style: italic; padding: 2px 0; text-decoration: underline; font-family: 'Karla', system-ui, sans-serif; }
.mp-hidden-toggle:hover { color: var(--sage-deep); }


.mp-row { display: flex; gap: 4px; align-items: center; position: relative; }
.mp-row > .mp-autocomplete-wrap { flex: 1 1 auto; min-width: 0; }
.mp-row > .mp-row-name { flex: 1 1 auto; min-width: 0; }
.mp-row > .mp-row-portion { flex: 0 0 52px; }
.mp-row > .mp-row-del { flex: 0 0 20px; }
.mp-row-name, .mp-row-portion { border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font-size: 12px; background: #fff; color: var(--ink); width: 100%; }
.mp-row-name { min-width: 0; }
.mp-row-unresolved .mp-row-name { border-color: var(--gold); background: var(--gold-soft); }
.mp-row-del { background: none; border: none; color: var(--ink-soft); font-size: 15px; line-height: 1; padding: 4px; }
.mp-row-del:hover { color: var(--brick); }
.mp-row-del.mp-confirm { color: #fff; background: var(--brick); font-size: 10px; font-weight: 600; border-radius: 4px; padding: 3px 5px; }
.mp-add-row { align-self: flex-start; background: none; border: none; color: var(--sage-deep); font-size: 11px; font-weight: 600; padding: 2px 0; font-family: 'Karla', system-ui, sans-serif; }
.mp-add-row:hover { text-decoration: underline; }

.mp-nutrition-label { margin-top: auto; padding-top: 10px; }
.mp-nl-title { font-size: 12px; letter-spacing: 0; font-weight: 700; color: var(--ink); margin: 0 0 4px; }
.mp-nl-rule-thick { height: 4px; background: var(--accent-text, var(--ink)); margin-bottom: 4px; }
.mp-nl-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-top: 1px solid var(--line); font-size: 11px; gap: 6px; }
.mp-nl-row:first-child { border-top: none; }
.mp-nl-label { color: var(--ink-soft); flex: 1; }
.mp-nl-value { color: var(--ink); font-weight: 500; white-space: nowrap; }
.mp-nl-pct { font-weight: 700; padding: 1px 6px; border-radius: 10px; font-size: 10px; white-space: nowrap; }
.mp-nl-pct.good { background: #E1EADB; color: var(--sage-deep); }
.mp-nl-pct.ok { background: var(--gold-soft); color: #8A6A22; }
.mp-nl-pct.low { background: var(--brick-soft); color: var(--brick); }

.mp-week-summary { margin-top: 26px; }
.mp-ws-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: var(--ink); }

/* week picker, calendar, prep icon, swipe-to-delete */
.mp-week-pick { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font: 600 14px 'Karla', system-ui, sans-serif; color: var(--ink); }
.mp-week-now { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; background: var(--ink); color: var(--chalk); border-radius: 999px; padding: 2px 8px; }
.mp-cal-card { max-width: 380px; width: 100%; text-align: left; }

/* Five fields side by side fit a laptop and run off the edge of a phone.

.mp-recipe-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; padding-top: 8px; flex-wrap: wrap; }

button, .mp-import-btn, .mp-photo-label { touch-action: manipulation; }

.mp-done-toggle { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font-size: 11px; font-weight: 600; color: var(--ink-soft); font-family: 'Karla', system-ui, sans-serif; }

.mp-settings-heading { font-size: 14px; color: var(--ink); margin: 4px 0 4px; }

.mp-nw-modal { max-width: 980px; width: 100%; text-align: left; display: flex; flex-direction: column; max-height: 92vh; }

      if(el) el.value = '';
      await refreshMembers();
      rerender();
      showMessage(email + ' can now open the planner.');
    } catch(e){
      showMessage('Could not reach Supabase.');
    }
  }
  async function removeMember(btn){
    const email = String(btn.dataset.email || '').trim().toLowerCase();
    if(!email) return;
    if(email === myEmail()){
      showMessage('That is the account you are signed in with — removing it would lock you out.');
      return;
    }
    requestDelete('member:' + email, async function(){
      try {
        const res = await fetch(SUPABASE_URL + MEMBER_TABLE + '?email=eq.' + encodeURIComponent(email), {
          method: 'DELETE',

        });
        if(!res.ok){ showMessage('Could not remove that address (' + res.status + ').'); return; }

      }

  async function loadState(){
    try {
      const res = await fetch(SUPABASE_URL + 'planner_data?id=eq.main&select=value', {
        headers: supabaseHeaders()
      });
      if(!res.ok) throw new Error('Load failed: ' + res.status);
      const rows = await res.json();
      if(rows && rows.length && rows[0].value && Object.keys(rows[0].value).length){
        state = rows[0].value;
        knownRev = parseInt(state._rev, 10) || 0;
        migrateState();
      } else {
        state = defaultState();
        knownRev = 0;
        await persistNow();
      }
    } catch(err){
      console.error('Load failed, using defaults', err);
      state = defaultState();
      knownRev = 0;
      try { await persistNow(); } catch(e2){ console.error('Initial save failed', e2); }
    }
  }

  async function persistNow(retriesLeft){
    if(retriesLeft === undefined) retriesLeft = 2;
    if(conflictPending) return;
    if(savingInFlight){ saveQueued = true; return; }
    savingInFlight = true;
    setSaveStatus('saving');
    const baseRev = knownRev;
    const nextRev = baseRev + 1;
    try {
      const payload = Object.assign({}, state, {_rev: nextRev});
      const filter = (baseRev === 0)
        ? 'planner_data?id=eq.main&or=(value->>_rev.is.null,value->>_rev.eq.0)'
        : 'planner_data?id=eq.main&value->>_rev=eq.' + baseRev;
      const res = await fetch(SUPABASE_URL + filter, {
        method: 'PATCH',
        headers: supabaseHeaders({
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        }),
        body: JSON.stringify({ value: payload })
      });
      if(res.status === 401 || res.status === 403){
        // The access token expired while the page was open. Renew it and try
        // the same save again rather than reporting a failure.
        savingInFlight = false;
        const renewed = await refreshSession();
        if(renewed && retriesLeft > 0){ persistNow(retriesLeft-1); return; }
        setSaveStatus('error');
        if(!renewed){
          saveSession(null);
          authState = 'out';
          authMessage = 'Your sign-in expired. Sign in again \u2014 your last change may not have been saved.';
          renderGate();
        }
        return;
      }
      if(!res.ok){
        savingInFlight = false;
        if(retriesLeft > 0){ setTimeout(function(){ persistNow(retriesLeft-1); }, 1500); return; }
        setSaveStatus('error'); return;
      }
      const rows = await res.json();
      if(!rows || !rows.length){
        savingInFlight = false;
        // Nobody matched our expected revision — either someone else saved, or RLS is blocking.
        const check = await fetch(SUPABASE_URL + 'planner_data?id=eq.main&select=value', { headers: supabaseHeaders() });
        if(check.ok){
          const cur = await check.json();
          const remoteRev = (cur && cur.length && cur[0].value) ? (parseInt(cur[0].value._rev, 10) || 0) : 0;
          if(remoteRev !== baseRev){
            conflictPending = true;
            setSaveStatus('error');
            rerender();
            return;
          }
        }
        console.error('Save updated 0 rows — check Supabase RLS policies on planner_data.');
        if(retriesLeft > 0){ setTimeout(function(){ persistNow(retriesLeft-1); }, 1500); return; }
        setSaveStatus('error'); return;
      }
      knownRev = nextRev;
      state._rev = nextRev;
      setSaveStatus('saved');
    } catch(err){
      console.error('Save failed', err);
      savingInFlight = false;
      if(retriesLeft > 0){ setTimeout(function(){ persistNow(retriesLeft-1); }, 1500); return; }
      setSaveStatus('error');
      return;
    }
    savingInFlight = false;
    if(saveQueued){ saveQueued = false; persistNow(); }
  }
  async function reloadAfterConflict(){
    conflictPending = false;
    setSaveStatus('saving');
    await loadState();
    rerender();
    showMessage('Reloaded the latest version.');
  }
  function overwriteAfterConflict(){
    conflictPending = false;
    fetch(SUPABASE_URL + 'planner_data?id=eq.main&select=value', { headers: supabaseHeaders() })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(cur){
        knownRev = (cur && cur.length && cur[0].value) ? (parseInt(cur[0].value._rev, 10) || 0) : 0;
        persistNow();
        showMessage('Your version has been saved over theirs.');
      })
      .catch(function(){ setSaveStatus('error'); });
  }

  function scheduleSave(){
    setSaveStatus('pending');
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ persistNow(); }, 700);
  }

  function retrySaveNow(){
    if(currentSaveStatus !== 'error') return;
    if(saveTimer) clearTimeout(saveTimer);
    persistNow();
  }

  function setSaveStatus(status){
    currentSaveStatus = status;
    const map = {pending:'Editing…', saving:'Saving…', saved:'', error:'Could not save — tap to retry'};
    const el = document.getElementById('save-status');
    if(el){
      // Nothing at rest. A pill permanently reading "Saved" is a light that is
      // always on, and tells you something only when it changes.
      el.textContent = map[status] || '';
      el.className = 'mp-save-status ' + status;
    }
    // The header is behind the recipe editor, so it needs its own copy.
    const inModal = document.getElementById('recipe-save-status');
    if(inModal){
      const m = {pending:'Not saved yet', saving:'Saving…', saved:'All changes saved', error:'Could not save'};
      inModal.textContent = (status === 'saved' ? '\u2713 ' : '') + (m[status] || 'All changes saved');
      inModal.className = 'mp-save-status mp-recipe-save ' + status;
    }
  }
  async function flushSave(){
    // Stop waiting for the debounce and push now, then wait for any save that
    // was already in flight to finish, so "saved" means saved.
    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
    await persistNow();
    for(let i = 0; i < 50 && (savingInFlight || saveQueued); i++){
      await new Promise(function(r){ setTimeout(r, 100); });
    }
    return currentSaveStatus === 'saved';
  }
  async function saveAndCloseRecipe(){
    if(currentSaveStatus === 'saved'){ closeRecipe(); return; }
    setSaveStatus('saving');
    const okNow = await flushSave();
    if(okNow){
      closeRecipe();
      showMessage('Recipe saved.');
    } else {
      rerender();     // stay open — nothing typed is lost
      showMessage('Still not saved. Check your connection and try again.');
    }
  }

  function update(mutFn){
    mutFn();
    scheduleSave();
    rerender();

  // For typing fields: save without redrawing. Replacing the focused field on

  // For typing fields that do need the screen to change (search, scaling):

  let rerenderTimer = null;

    rerenderTimer = setTimeout(function(){ rerenderTimer = null; rerender(); }, 350);

  function updateSoon(mutFn){

  function rerender(){
    const active = document.activeElement;
    let info = null;
    if(active && active.id && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA')){
      info = {id: active.id, tag: active.tagName, start:null, end:null};
      try { info.start = active.selectionStart; info.end = active.selectionEnd; } catch(e){}
    }
    const oldDaysRow = document.querySelector('.mp-days-row');
    const daysScrollLeft = oldDaysRow ? oldDaysRow.scrollLeft : null;
    const oldPanel = document.querySelector('.mp-recipe-panel');
    const panelScrollTop = oldPanel ? oldPanel.scrollTop : null;
    const pageScrollY = window.scrollY;
    renderApp();
    if(info){
      const el = document.getElementById(info.id);
      if(el){
        el.focus({preventScroll: true});
        if(info.start !== null){
          try { el.setSelectionRange(info.start, info.end); } catch(e){}
        }
      }
    }
    if(daysScrollLeft !== null){
      const newDaysRow = document.querySelector('.mp-days-row');
      if(newDaysRow) newDaysRow.scrollLeft = daysScrollLeft;
    }
    if(panelScrollTop !== null){
      const newPanel = document.querySelector('.mp-recipe-panel');
      if(newPanel) newPanel.scrollTop = panelScrollTop;
    }
    if(window.scrollY !== pageScrollY) window.scrollTo(0, pageScrollY);

  function focusById(id){

  function paintToast(){
    const root = document.getElementById('mp-root'); if(!root) return;
    let t = root.querySelector('.mp-toast');
    if(!uiMessage){ if(t) t.remove(); return; }
    if(!t){
      t = document.createElement('div');
      t.className = 'mp-toast';
      // Sit directly under the pinned bar. The anchor has to be a child of
      // root: the header moved inside .mp-topbar, and insertBefore throws when
      // the reference node belongs to someone else.
      const bar = root.querySelector('.mp-topbar');
      const after = (bar && bar.parentNode === root) ? bar.nextSibling : root.firstChild;
      root.insertBefore(t, after);
    }
    t.textContent = uiMessage;
  }
  function toastOnly(msg){

  function requestDelete(key, action){

      if(pendingDeleteTimer) clearTimeout(pendingDeleteTimer);
      pendingDelete = null;
      action();
    } else {

      if(pendingDeleteTimer) clearTimeout(pendingDeleteTimer);

  // ---------- nutrient math ----------
  function findIngredient(name){
    if(!name) return null;
    const key = String(name).trim().toLowerCase();
    if(!key) return null;
    return state.ingredients.find(i => i.name.trim().toLowerCase() === key) || null;
  }
  // ---------- recipes used inside other recipes ----------
  function recipeById(id){
    return id ? state.recipes.find(function(x){ return x.id === id; }) || null : null;
  }
  function recipeByName(name){
    const k = String(name || '').trim().toLowerCase();
    if(!k) return null;
    return state.recipes.find(function(r){ return (r.name || '').trim().toLowerCase() === k; }) || null;
  }
  function recipeYield(r){
    // What one batch makes. Without a declared yield, a batch is its servings.
    const amt = num(r && r.yieldAmount);
    if(amt > 0) return {amount: amt, unit: (r.yieldUnit || '').trim() || 'portion'};
    return {amount: num(r && r.servings) || 1, unit: 'portion'};
  }
  function subRecipeOf(row){
    // Rows carry the id; the name is only for display and older data.
    if(row && row.recipeId) return recipeById(row.recipeId);
    return null;
  }
  function recipeUses(parentId, childId, seen){
    // Would putting child inside parent make a loop?
    if(parentId === childId) return true;
    seen = seen || {};
    if(seen[childId]) return false;
    seen[childId] = true;
    const child = recipeById(childId);
    if(!child) return false;
    return (child.items || []).some(function(it){
      return it.recipeId && recipeUses(parentId, it.recipeId, seen);
    });
  }
  function recipeTotalNutrition(r, seen){
    // The whole batch, not one serving.
    const total = {};
    nutrients().forEach(function(k){ total[k.key] = 0; });
    if(!r) return total;
    seen = seen || {};
    if(seen[r.id]) return total;          // a loop contributes nothing
    seen[r.id] = true;
    (r.items || []).forEach(function(it){
      const n = rowNutrients(it, seen);
      nutrients().forEach(function(k){ total[k.key] += n[k.key]; });
    });
    delete seen[r.id];
    return total;
  }
  function rowNutrients(row, seen){
    const out = {};
    nutrients().forEach(function(k){ out[k.key] = 0; });
    const portion = num(row.portion);
    if(!portion) return out;

    const sub = subRecipeOf(row);
    if(sub){
      // "500 ml of Broth" where a batch of broth makes 1500 ml -> a third of it.
      const y = recipeYield(sub);
      const share = portion / (y.amount || 1);
      const tot = recipeTotalNutrition(sub, seen);
      nutrients().forEach(function(k){ out[k.key] = tot[k.key] * share; });
      return out;
    }
    const item = findIngredient(row.name);
    if(!item){
      // A row can carry a recipe's name rather than an ingredient's: a meal
      // planned before that recipe gained a sub-recipe, or a recipe typed
      // straight into a row. It used to resolve to nothing and quietly count
      // as zero, so a day could be short of a whole dish without saying so.
      const asRecipe = recipeByName(row.name);
      if(asRecipe && !(seen && seen[asRecipe.id])){
        const y = recipeYield(asRecipe);
        const share = portion / (y.amount || 1);
        const tot = recipeTotalNutrition(asRecipe, seen);
        nutrients().forEach(function(k){ out[k.key] = tot[k.key] * share; });
      }
      return out;
    }
    const ref = num(item.refPortion) || 1;
    nutrients().forEach(n=>{
      out[n.key] = num(item[n.key]) / ref * portion;
    });
    return out;
  }
  function expandRecipeItems(r, factor, seen, out){
    // Flatten down to real ingredients, so the shopping list never sees a recipe.
    out = out || [];
    if(!r) return out;
    seen = seen || {};
    if(seen[r.id]) return out;
    seen[r.id] = true;
    (r.items || []).forEach(function(it){
      const sub = subRecipeOf(it);
      if(sub){
        const y = recipeYield(sub);
        const share = num(it.portion) / (y.amount || 1);
        if(share) expandRecipeItems(sub, factor * share, seen, out);
        return;
      }
      const empty = (it.portion === '' || it.portion === null || it.portion === undefined);
      out.push({name: it.name, portion: empty ? '' : num(it.portion) * factor});
    });
    delete seen[r.id];
    return out;
  }
  function mergeRows(rows){
    // The same ingredient can arrive from the recipe itself and from a sub-recipe;
    // one line reads better than two.
    const order = [], byKey = {};
    rows.forEach(function(row){
      const key = (row.name || '').trim().toLowerCase();
      if(!key){ order.push(row); return; }
      if(!byKey[key]){ byKey[key] = {name: row.name, portion: row.portion}; order.push(byKey[key]); return; }
      const a = byKey[key].portion, b = row.portion;
      const aEmpty = (a === '' || a === null || a === undefined);
      const bEmpty = (b === '' || b === null || b === undefined);
      byKey[key].portion = (aEmpty && bEmpty) ? '' : num(a) + num(b);
    });
    return order;
  }
  function rowHasNutrition(row){
    const item = findIngredient(row.name);
    if(!item) return true;
    return nutrients().some(function(n){ return num(item[n.key]) !== 0; });
  }
  function splitRowsByNutrition(rowItems){
    const visible = []; const hidden = [];
    rowItems.forEach(function(x){ (rowHasNutrition(x.row) ? visible : hidden).push(x); });
    return {visible: visible, hidden: hidden};
  }
  function renderRowsWithHiddenToggle(week, day, slot, rowItems, toggleKey){
    const split = splitRowsByNutrition(rowItems);
    let out = split.visible.map(function(x){ return renderRow(week, day, slot, x.row, x.idx); }).join('');
    if(split.hidden.length){
      const open = !!expandedMeals[toggleKey];
      if(open){
        out += split.hidden.map(function(x){ return renderRow(week, day, slot, x.row, x.idx); }).join('');
        out += '<button type="button" class="mp-hidden-toggle" onclick="toggleMealExpanded(\'' + toggleKey + '\')">Hide ' + split.hidden.length + ' with no nutrition data</button>';
      } else {
        out += '<button type="button" class="mp-hidden-toggle" onclick="toggleMealExpanded(\'' + toggleKey + '\')">+ ' + split.hidden.length + ' more (no nutrition data — still in the shopping list)</button>';
      }
    }
    return out;
  }
  function slotNutrients(week, day, slot){
    const total = {};
    nutrients().forEach(function(k){ total[k.key] = 0; });
    const slotObj = week.days[day][slot];
    const viewId = plannerPersonView;
    slotObj.rows.forEach(r=>{
      if(r.choiceId){
        const choice = (slotObj.choices||[]).find(c=>c.id===r.choiceId);
        const ppl = choice ? (choice.people || allPersonIds()) : allPersonIds();
        if(ppl.indexOf(viewId) === -1) return;
      }
      const n = rowNutrients(r);
      nutrients().forEach(k=> total[k.key] += n[k.key]);
    });
    return total;
  }
  function dayNutrients(week, day){
    const total = {};
    nutrients().forEach(function(k){ total[k.key] = 0; });
    SLOTS.forEach(s=>{
      const n = slotNutrients(week, day, s);
      nutrients().forEach(k=> total[k.key] += n[k.key]);
    });
    return total;
  }
  function weekNutrients(week){
    const total = {};
    nutrients().forEach(function(k){ total[k.key] = 0; });
    DAYS.forEach(d=>{
      const n = dayNutrients(week, d);
      nutrients().forEach(k=> total[k.key] += n[k.key]);
    });
    return total;
  }
  function pctClass(pct){ return pct >= 100 ? 'good' : (pct >= 70 ? 'ok' : 'low'); }

  // ---------- week actions ----------
  function setActiveWeek(id){ update(()=>{ state.activeWeekId = id; }); }
  // ---------- week generator ----------
  // Plans are per person: plan[day][slot] = {personId: recipeId}. Two people usually
  // get the same dish, but not when their own rules differ — a work-day lunch is the
  // common case, since they may be in the office on different days.
  function planPeopleIds(){
    const ids = people().filter(function(p){ return !p.guest; }).map(function(p){ return p.id; });
    return ids.length ? ids : [state.planning.targetPerson];
  }
  function defaultWorkDays(){
    const wd = {};
    planPeopleIds().forEach(function(pid){
      const own = (state.workDaysByPerson || {})[pid];
      wd[pid] = Array.isArray(own) ? own.slice() : (state.workDays || []).slice();
    });
    return wd;
  }
  function worksOn(wd, pid, day){
    return (((wd || {})[pid]) || []).indexOf(day) !== -1;
  }
  function anyWorkLunches(){
    return state.recipes.some(function(r){ return r.workLunch; });
  }
  function mainCandidates(kind, day, wd, pid){
    let list = state.recipes.filter(function(r){
      return (r.suitableFor||[]).indexOf(kind) !== -1 && r.course === 'Main';
    });
    // Only honour the work-lunch filter once something is actually marked as one;
    // otherwise every work-day lunch would come out empty.
    if(kind === 'Lunch' && worksOn(wd, pid, day) && anyWorkLunches()){
      list = list.filter(function(r){ return !!r.workLunch; });
    }
    return list;
  }
  function learnedBias(r){
    // Recipes you keep when proposed get a small lift; ones you keep swapping out sink.
    // Scaled by how much evidence there is, so one swap doesn't bury a recipe.
    const L = state.learning && state.learning[r.id];
    if(!L || !L.proposed) return 0;
    const confidence = Math.min(L.proposed, 6) / 6;
    return (L.kept / L.proposed - 0.6) * 0.4 * confidence;
  }
  function plannedFor(plan, fixed, d, s, pid){
    const pin = fixed && fixed[d] && fixed[d][s] && fixed[d][s][pid];
    if(pin) return pin;
    const a = plan && plan[d] && plan[d][s];
    return (a && a[pid]) || null;
  }
  function targetDayTotals(plan, d, fixed){
    const nuts = nutrients(), tot = {}, target = state.planning.targetPerson;
    nuts.forEach(function(n){ tot[n.key] = 0; });
    SLOTS.forEach(function(s){
      const rid = plannedFor(plan, fixed, d, s, target);
      const r = rid && state.recipes.find(function(x){ return x.id === rid; });
      if(!r) return;
      const nn = recipeNutrition(r);
      nuts.forEach(function(n){ tot[n.key] += nn[n.key] || 0; });
    });
    return tot;
  }
  function computeBoosters(plan, fixed){
    // After the meals are chosen, top up the target person's remaining daily
    // shortfall with booster ingredients, each capped at its max per meal.
    const out = {};
    if(!state.planning.useBoosters) return out;
    const boosters = state.ingredients.filter(function(i){ return i.booster; });
    if(!boosters.length) return out;
    const nuts = nutrients(), target = state.planning.targetPerson;
    DAYS.forEach(function(d){
      const tot = targetDayTotals(plan, d, fixed);
      const gap = {};
      nuts.forEach(function(n){ const t = num(state.targets[n.key]); gap[n.key] = t ? Math.max(0, t - tot[n.key]) : 0; });
      let slot = null;
      ['Dinner','Lunch','Breakfast'].some(function(s){
        if(plannedFor(plan, fixed, d, s, target)){ slot = s; return true; }
        return false;
      });
      if(!slot) return;
      const used = [], list = [];
      for(let k = 0; k < 3; k++){
        let best = null, bestScore = 0.04, bestAmt = 0;
        boosters.forEach(function(b){
          if(used.indexOf(b.id) !== -1) return;
          const ref = num(b.refPortion) || 1;
          const cap = num(b.boosterMax) || ref;
          let need = 0;
          nuts.forEach(function(n){
            const per = num(b[n.key]) / ref;
            if(per > 0 && gap[n.key] > 0) need = Math.max(need, gap[n.key] / per);
          });
          if(!need) return;
          let amt = Math.min(cap, need);
          amt = ref >= 10 ? Math.max(5, Math.round(amt / 5) * 5) : Math.max(0.5, Math.round(amt * 2) / 2);
          amt = Math.min(amt, cap);
          let score = 0, cnt = 0;
          nuts.forEach(function(n){
            const t = num(state.targets[n.key]); if(!t) return;
            cnt++;
            score += Math.min(num(b[n.key]) / ref * amt, gap[n.key]) / t;
          });
          score = cnt ? score / cnt : 0;
          if(score > bestScore){ bestScore = score; best = b; bestAmt = amt; }
        });
        if(!best) break;
        used.push(best.id);
        const ref = num(best.refPortion) || 1;
        nuts.forEach(function(n){ gap[n.key] = Math.max(0, gap[n.key] - num(best[n.key]) / ref * bestAmt); });
        list.push({id: best.id, name: best.name, amount: bestAmt, slot: slot});
      }
      if(list.length) out[d] = list;
    });
    return out;
  }
  function boosterLines(list){
    if(!list || !list.length) return '';
    return '<div class="mp-nw-boost">' + list.map(function(b){
      return '<span>+ ' + (Math.round(b.amount * 10) / 10) + ' ' + esc(b.name) + ' <em>' + esc((SLOT_LABELS[b.slot] || b.slot).toLowerCase()) + '</em></span>';
    }).join('') + '</div>';

  function toggleUseBoosters(el){

  function proposeWeek(wd, fixed){
    fixed = fixed || {};
    const target = state.planning.targetPerson;
    const ppl = planPeopleIds();
    const share = !!state.planning.shareMeals;
    // Greedy, day by day. Each meal picks the main that best fills what the target
    // person still needs that day; people whose options differ get their own pick.
    const nuts = nutrients();
    const plan = {};
    const useCount = {};
    const lastDay = {};
    const nutCache = {};
    function nutOf(r){ if(!nutCache[r.id]) nutCache[r.id] = recipeNutrition(r); return nutCache[r.id]; }

    DAYS.forEach(function(d, di){
      plan[d] = {};
      const dayTotal = {};
      nuts.forEach(function(n){ dayTotal[n.key] = 0; });
      const countedToday = {};
      function countUse(rid){
        if(countedToday[rid]) return;
        countedToday[rid] = true;
        useCount[rid] = (useCount[rid] || 0) + 1;
        lastDay[rid] = di;
      }

      SLOTS.forEach(function(s){
        plan[d][s] = {};
        const pinned = (fixed[d] && fixed[d][s]) || {};

        // Pinned meals still count towards the target's day and towards variety.
        ppl.forEach(function(pid){
          const rid = pinned[pid]; if(!rid) return;
          const r = state.recipes.find(function(x){ return x.id === rid; }); if(!r) return;
          countUse(rid);
          if(pid === target){
            const fn = nutOf(r);
            nuts.forEach(function(n){ dayTotal[n.key] += fn[n.key] || 0; });
          }
        });

        const need = ppl.filter(function(pid){ return !pinned[pid]; });
        if(!need.length) return;

        // People with identical options can eat the same thing. Different options —
        // one of them is at work, say — means a separate pick.
        const groups = {};
        const order = [];
        need.forEach(function(pid){
          const cands = mainCandidates(SLOT_KIND[s], d, wd, pid);
          const key = share ? cands.map(function(r){ return r.id; }).join('|') : pid;
          if(!groups[key]){ groups[key] = {cands: cands, people: []}; order.push(key); }
          groups[key].people.push(pid);
        });
        // The target person's group picks first, on nutrition; the others then reuse
        // that dish when they can, so there is still only one thing to cook.
        order.sort(function(a, b){
          return (groups[a].people.indexOf(target) !== -1 ? 0 : 1) - (groups[b].people.indexOf(target) !== -1 ? 0 : 1);
        });

        let targetPick = null;
        order.forEach(function(k){
          const g = groups[k];
          if(!g.cands.length){ g.people.forEach(function(pid){ plan[d][s][pid] = null; }); return; }
          const forTarget = g.people.indexOf(target) !== -1;

          let best = null;
          if(share && !forTarget && targetPick){
            best = g.cands.find(function(r){ return r.id === targetPick; }) || null;   // cook once where allowed
          }
          if(!best){

            g.cands.forEach(function(r){

                  if(!t) return;

                  counted++;

              score -= (useCount[r.id] || 0) * 0.35;                                  // variety across the week
              if(lastDay[r.id] !== undefined && di - lastDay[r.id] < 3) score -= 0.5; // not again within 3 days
              score += (r.favourite ? 0.08 : 0) + learnedBias(r);                    // gentle nudge for favourites
              score += Math.random() * 0.08;                                          // so reproposing differs
              if(score > bestScore){ bestScore = score; best = r; }

    // Slots a rule has claimed are off limits to the rules after it, or the second
    // rule quietly undoes the first and neither ends up satisfied.
    const claimed = {};
    planRules().forEach(function(ru){
      if(ru.type !== 'atLeast') return;
      const r = state.recipes.find(function(x){ return x.id === ru.recipeId; }); if(!r) return;
      const need = Math.max(0, parseInt(ru.count, 10) || 0);
      const who = (ru.people && ru.people.length)
        ? ru.people.filter(function(pid){ return ppl.indexOf(pid) !== -1; })
        : ppl;
      if(!who.length || !need) return;
      function hasAt(d, s){

      function dayHasR(d){ return SLOTS.some(function(s){ return hasAt(d, s); }); }

      // rule, whether it came from the main pass or from an earlier rule.
      let have = 0, secured = 0;
      DAYS.forEach(function(d){ SLOTS.forEach(function(s){

        secured++;

          if(plannedFor(plan, fixed, d, s, pid) === r.id) claimed[d + '|' + s + '|' + pid] = true;
        });
      }); });
      const spots = [];
      DAYS.forEach(function(d, di){ SLOTS.forEach(function(s){
        if(dayHasR(d)) return;

          if(fixed[d] && fixed[d][s] && fixed[d][s][pid]) return false;          // pinned, leave it
          if(claimed[d + '|' + s + '|' + pid]) return false;                     // an earlier rule put its dish here
          if(!plan[d][s] || !plan[d][s][pid]) return false;                      // nothing there to swap

        });

      while(have < need && spots.length){
        const used = DAYS.map(function(d, i){ return dayHasR(d) ? i : -1; }).filter(function(i){ return i >= 0; });
        let bi = 0, bd = -1;
        spots.forEach(function(sp, k){

          if(dist > bd){ bd = dist; bi = k; }
        });
        const sp = spots.splice(bi, 1)[0];
        who.forEach(function(pid){
          plan[sp.d][sp.s][pid] = r.id;
          claimed[sp.d + '|' + sp.s + '|' + pid] = true;
        });
        have++;

  function unmetRules(plan, fixed){
    const out = [];

    planRules().forEach(function(ru){
      if(ru.type !== 'atLeast') return;
      const r = state.recipes.find(function(x){ return x.id === ru.recipeId; }); if(!r) return;
      const who = (ru.people && ru.people.length)
        ? ru.people.filter(function(pid){ return ppl.indexOf(pid) !== -1; })
        : ppl;
      if(!who.length) return;
      let have = 0;
      DAYS.forEach(function(d){ SLOTS.forEach(function(s){
        if(who.some(function(pid){ return plannedFor(plan, fixed, d, s, pid) === r.id; })) have++;
      }); });
      const need = parseInt(ru.count, 10) || 0;
      if(have < need){
        const forWho = (ru.people && ru.people.length) ? ' for ' + ru.people.map(personName).join(' & ') : '';

  function proposalDayPct(plan, d, fixed, boosters){
    const nuts = nutrients();

    nuts.forEach(function(n){ tot[n.key] = 0; });
    const target = state.planning.targetPerson;
    SLOTS.forEach(function(s){
      const rid = plannedFor(plan, fixed, d, s, target); if(!rid) return;
      const r = state.recipes.find(function(x){ return x.id === rid; }); if(!r) return;
      const nn = recipeNutrition(r);
      nuts.forEach(function(n){ tot[n.key] += nn[n.key] || 0; });
    });
    ((boosters && boosters[d]) || []).forEach(function(b){
      const ing = state.ingredients.find(function(i){ return i.id === b.id; }); if(!ing) return;
      const ref = num(ing.refPortion) || 1;
      nuts.forEach(function(n){ tot[n.key] += num(ing[n.key]) / ref * b.amount; });
    });
    return nuts.map(function(n){

    if(!ppl.length) return [];
    let list = mainCandidates(SLOT_KIND[s], d, wd, ppl[0]);
    ppl.slice(1).forEach(function(pid){
      const ok = mainCandidates(SLOT_KIND[s], d, wd, pid).map(function(r){ return r.id; });

  function spinMeal(el){

    const d = el.dataset.day, s = el.dataset.slot;
    const who = groupPeople(el); if(!who.length) return;
    const all = groupCandidates(s, d, p.wd, who);
    const cur = p.plan[d][s] && p.plan[d][s][who[0]];
    if(!p.seen) p.seen = {};
    const key = d + '|' + s + '|' + who.join(',');

    if(cur && seen.indexOf(cur) === -1) seen.push(cur);
    let pool = all.filter(function(r){ return seen.indexOf(r.id) === -1; });
    if(!pool.length){
      seen = cur ? [cur] : [];
      pool = all.filter(function(r){ return r.id !== cur; });
    }
    if(!pool.length){ showMessage('No other recipe fits this meal.'); return; }

    const target = state.planning.targetPerson;
    const forTarget = who.indexOf(target) !== -1;
    const nuts = nutrients();
    const dayTotal = {};
    nuts.forEach(function(n){ dayTotal[n.key] = 0; });

      const r = rid && state.recipes.find(function(x){ return x.id === rid; });

    });
    const useCount = {};
    DAYS.forEach(function(d2){ SLOTS.forEach(function(s2){

      const seenHere = {};

    let best = null, bestScore = -Infinity;
    pool.forEach(function(r){

        let fill = 0, counted = 0;
        nuts.forEach(function(n){

          const L = state.learning[rid] || (state.learning[rid] = {proposed: 0, kept: 0});
          L.proposed++;
          const kept = Object.keys(o).some(function(q){ return o[q] === rid && now[q] === rid; });
          if(kept) L.kept++;
        });
      }); });
    }
    pendingNewWeek = null;
    update(()=>{ state.weeks.push(w); state.activeWeekId = w.id; });

  function propagateIngredientRename(oldName, newName){
    if(!oldName || !newName || oldName === newName) return;
    const oldKey = oldName.trim().toLowerCase();
    let changed = false;
    state.recipes.forEach(function(r){
      r.items.forEach(function(it){
        if(it.name && it.name.trim().toLowerCase() === oldKey){ it.name = newName; changed = true; }
      });
    });
    state.weeks.forEach(function(w){
      DAYS.forEach(function(d){
        SLOTS.forEach(function(s){
          const slotObj = w.days[d] && w.days[d][s];
          if(!slotObj) return;
          (slotObj.rows||[]).forEach(function(r){
            if(r.name && r.name.trim().toLowerCase() === oldKey){ r.name = newName; changed = true; }
          });
          (slotObj.choices||[]).forEach(function(c){
            if(c.standalone && c.name && c.name.trim().toLowerCase() === oldKey){ c.name = newName; }
          });
        });
      });
      if(w.shoppingItems){
        Object.keys(w.shoppingItems).forEach(function(k){
          if(k.trim().toLowerCase() === oldKey && k !== newName){
            w.shoppingItems[newName] = w.shoppingItems[k];
            delete w.shoppingItems[k];
          }
        });
      }
    });
    if(changed) toastOnly('Renamed everywhere "' + oldName + '" was used.');
  }

  function addRecipe(){
    // A phone can deliver a second tap before the first has visibly done
    // anything, which used to leave a pile of identical "New recipe" entries.
    // One untouched blank is all there can ever be: reopen it instead.
    const blank = state.recipes.find(isPristineRecipe);

  function imageFileFromTransfer(dt){
    if(!dt) return null;
    if(dt.files && dt.files.length){
      for(let i = 0; i < dt.files.length; i++){
        if(/^image\//.test(dt.files[i].type)) return dt.files[i];
      }
    }
    if(dt.items){
      for(let i = 0; i < dt.items.length; i++){
        if(dt.items[i].kind === 'file' && /^image\//.test(dt.items[i].type)){
          const f = dt.items[i].getAsFile();
          if(f) return f;
        }
      }
    }
    return null;
  }
  function imageFilesFromTransfer(dt){
    if(!dt) return [];
    const out = [];
    Array.prototype.forEach.call(dt.files || [], function(f){ if(/^image\//.test(f.type)) out.push(f); });
    if(!out.length){
      Array.prototype.forEach.call(dt.items || [], function(it){
        if(it.kind === 'file' && /^image\//.test(it.type || '')){
          const f = it.getAsFile();
          if(f) out.push(f);
        }
      });
    }
    return out;
  }

    if(pendingStepsImport && pendingStepsImport.status === 'start'){
      e.preventDefault();

  // ---------- sharing recipes as a file ----------
  const RECIPE_FILE_FORMAT = 'family-meal-planner-recipes';
  function recipeBundle(recipes){
    // Carry the ingredients those recipes use, or they arrive unresolved on the
    // other side. Nutrition travels with them so the planner works straight away.
    // Recipes used inside these ones come too, or the link would dangle.
    const byId = {};
    (function collect(list){
      list.forEach(function(r){
        if(!r || byId[r.id]) return;
        byId[r.id] = r;
        const subs = (r.items || []).map(function(it){ return subRecipeOf(it); }).filter(Boolean);
        if(subs.length) collect(subs);
      });
    })(recipes);
    recipes = Object.keys(byId).map(function(k){ return byId[k]; });

    const wanted = {};
    recipes.forEach(function(r){
      (r.items || []).forEach(function(it){
        if(it.recipeId) return;                 // a sub-recipe, not an ingredient
        const n = (it.name || '').trim();
        if(n) wanted[n.toLowerCase()] = true;
      });
    });
    const ings = state.ingredients.filter(function(i){ return wanted[(i.name || '').trim().toLowerCase()]; });
    return {
      format: RECIPE_FILE_FORMAT,
      version: 1,
      exportedAt: new Date().toISOString().slice(0, 10),
      recipes: JSON.parse(JSON.stringify(recipes)),
      ingredients: JSON.parse(JSON.stringify(ings))
    };
  }
  async function embedPhotos(bundle){
    // Make the file self-contained: pull each photo back out of the bucket and
    // inline it, so it still works if the bucket is ever made private.
    let done = 0, failed = 0;
    for(const r of bundle.recipes){
      const url = r.photo;
      if(!url || isInlinePhoto(url)) continue;
      try {
        const res = await fetch(url, {cache: 'no-store'});
        if(!res.ok){ failed++; continue; }
        const blob = await res.blob();
        if(blob.size > 3000000){ failed++; continue; }     // keep the file sane
        r.photo = await new Promise(function(resolve){
          const fr = new FileReader();
          fr.onload = function(){ resolve(String(fr.result || '')); };
          fr.onerror = function(){ resolve(''); };
          fr.readAsDataURL(blob);
        });
        if(r.photo) done++; else { r.photo = url; failed++; }
      } catch(e){ failed++; }
    }
    return {done: done, failed: failed};
  }

  function ingredientNamesInUse(){
    const seen = {};
    const order = [];
    const recipeNames = {};
    (state.recipes || []).forEach(function(r){ recipeNames[(r.name||'').trim().toLowerCase()] = true; });
    const add = function(raw, fromList){
      const n = String(raw == null ? '' : raw).trim();
      if(!n) return;
      const k = n.toLowerCase();
      if(!fromList && recipeNames[k]) return;     // that is a recipe, not an ingredient

    (state.recipes || []).forEach(function(r){

  function buildIngredientTranslation(){
    return ingredientNamesInUse().map(function(entry){
      const nu = nameAndUnit(entry.name);
      const hit = italianIngredientName(nu.name);
      return {
        old: entry.name,
        inList: entry.inList,
        oldPlain: nu.name,
        oldUnit: nu.unit,
        plain: hit || nu.name,
        unit: italianUnit(nu.unit),
        known: !!hit

  // Two English names can land on the same Italian one — "Hazelnuts" and the
  // "Nocciole" typed into a recipe one evening, "Soy Sauce" and "Soya Sauce".
  // That is a merge, and usually a welcome one: the spellings collapse onto a
  // single ingredient. It only costs something when BOTH sides are real
  // entries in the list, because then one row has to go.
  function translationMerges(rows){
    const byNew = {};
    rows.forEach(function(r){
      const k = composeIngredientName(r.plain, r.unit).trim().toLowerCase();
      if(!k) return;
      (byNew[k] = byNew[k] || []).push(r);
    });
    const groups = [];
    Object.keys(byNew).forEach(function(k){
      const g = byNew[k];
      if(g.length < 2) return;
      const inList = g.filter(function(r){ return r.inList; });
      if(inList.length > 1){
        // The entry carrying the most nutrition is the one worth keeping.
        inList.sort(function(a, b){
          return filledNutrientCount(findIngredient(b.old)) - filledNutrientCount(findIngredient(a.old));

  function filledNutrientCount(ing){
    if(!ing) return -1;

  // The rename itself, shared by the translation and by undoing it. byFull
  // maps a whole name ("Egg [unit]") and byPlain the bare one the shopping
  // list is sometimes keyed by; both are lowercased keys.
  function applyIngredientRename(byFull, byPlain, dropNames, restore){
    const rename = function(name){
      const hit = byFull[String(name == null ? '' : name).trim().toLowerCase()];
      return hit === undefined ? name : hit;
    };
    const drop = dropNames || {};
    if(Object.keys(drop).length){
      state.ingredients = (state.ingredients || []).filter(function(i){
        return !drop[String(i.name || '').trim().toLowerCase()];
      });
    }
    (restore || []).forEach(function(i){ state.ingredients.push(JSON.parse(JSON.stringify(i))); });
    (state.ingredients || []).forEach(function(i){
      const next = rename(i.name);
      if(next === i.name) return;
      i.name = next;
      i.unit = nameAndUnit(next).unit;     // the unit lives in both places
    });
    (state.recipes || []).forEach(function(r){
      (r.items || []).forEach(function(it){ if(!it.recipeId) it.name = rename(it.name); });
    });
    (state.weeks || []).forEach(function(w){
      DAYS.forEach(function(d){
        const day = (w.days || {})[d]; if(!day) return;
        SLOTS.forEach(function(sl){
          const slot = day[sl]; if(!slot) return;
          (slot.rows || []).forEach(function(row){ row.name = rename(row.name); });
          // A choice names a recipe unless it is a standalone ingredient.
          (slot.choices || []).forEach(function(c){ if(c.standalone) c.name = rename(c.name); });
        });
      });
      // Shopping entries are keyed by the bare name in older weeks and by the
      // full one in newer weeks, so try both.
      if(w.shoppingItems){
        const next = {};
        Object.keys(w.shoppingItems).forEach(function(k){
          const lk = k.trim().toLowerCase();
          const hit = byFull[lk] !== undefined ? byFull[lk] : byPlain[lk];
          const key = hit === undefined ? k : hit;
          // If two old names merge, keep whichever was already ticked.
          if(next[key] && next[key].checked) return;
          next[key] = w.shoppingItems[k];
        });
        w.shoppingItems = next;
      }
      (w.extraShoppingItems || []).forEach(function(x){ if(x && x.name) x.name = rename(x.name); });
    });

  function applyIngredientTranslation(){
    if(!pendingIngredientTranslate) return;
    const rows = pendingIngredientTranslate.rows;
    const byFull = {}, byPlain = {};
    const pairs = [];
    let changed = 0;
    rows.forEach(function(r){
      const next = composeIngredientName(r.plain, r.unit);
      if(!next.trim()) return;
      if(next !== r.old){ changed++; pairs.push([r.old, next, r.oldPlain, r.plain]); }
      byFull[r.old.trim().toLowerCase()] = next;
      const p = String(r.plain || '').trim();
      if(p) byPlain[String(r.oldPlain || '').trim().toLowerCase()] = p;
    });
    if(!changed){ pendingIngredientTranslate = null; rerender(); return; }
    // Where two list entries end up with one name, only the survivor stays.
    const drop = {};
    const droppedRows = [];
    translationMerges(rows).forEach(function(g){
      g.dropped.forEach(function(r){
        drop[r.old.trim().toLowerCase()] = true;
        const ing = findIngredient(r.old);
        if(ing) droppedRows.push(JSON.parse(JSON.stringify(ing)));
      });
    });
    const dropped = droppedRows.length;
    update(()=>{
      applyIngredientRename(byFull, byPlain, drop, null);
      // Keep what it would take to put it all back, so this is not a one-way
      // door on data that is shared with the rest of the house.
      state.lastTranslation = {at: Date.now(), pairs: pairs, dropped: droppedRows};
      pendingIngredientTranslate = null;
      toastOnly(changed + ' ingredient' + (changed === 1 ? '' : 's') + ' translated into Italian.' +
        (dropped ? ' ' + dropped + ' duplicate' + (dropped === 1 ? '' : 's') + ' merged away.' : ''));
    });
  }
  function undoIngredientTranslation(){
    const last = state.lastTranslation;

    if(pendingDelete !== 'undo-translation'){ requestDelete('undo-translation', undoIngredientTranslation); return; }
    const byFull = {}, byPlain = {};
    last.pairs.forEach(function(p){
      byFull[String(p[1]).trim().toLowerCase()] = p[0];
      if(p[3]) byPlain[String(p[3]).trim().toLowerCase()] = p[2];

    const n = last.pairs.length;
    update(()=>{
      applyIngredientRename(byFull, byPlain, null, last.dropped || []);

  // "Almond Butter [g]" -> {name: 'Almond Butter', unit: 'g'}
  function nameAndUnit(raw){
    const m = /^(.*?)\s*\[([^\]]+)\]\s*$/.exec(String(raw || '').trim());
    if(!m) return {name: String(raw || '').trim(), unit: ''};
    return {name: m[1].trim(), unit: m[2].trim()};

  function translatableStrings(bundle){
    // A Set, so "Olive Oil" used by thirty recipes is translated once.
    const seen = {};
    const add = function(v){
      const s = String(v == null ? '' : v).trim();
      if(!s) return;
      if(/^[\d\s.,/+-]+$/.test(s)) return;      // pure numbers need no translating
      seen[s] = true;
    };
    (bundle.recipes || []).forEach(function(r){
      add(r.name);
      add(r.course);
      add(r.type);
      (r.steps || []).forEach(function(st){ add(st && typeof st === 'object' ? st.text : st); });
      add(r.instructions);
      (r.items || []).forEach(function(it){ add(nameAndUnit(it.name).name); });
    });
    (bundle.ingredients || []).forEach(function(i){ add(nameAndUnit(i.name).name); });

  async function translateChunk(strings){
    const res = await fetch(importUrl(), {
      method: 'POST',
      headers: supabaseHeaders({'Content-Type': 'application/json'}),
      body: JSON.stringify({action: 'translate', strings: strings})
    });
    const out = await res.json().catch(function(){ return {}; });
    if(!res.ok || !Array.isArray(out.strings)) throw new Error(out.error || importError(res.status));
    if(out.strings.length !== strings.length) throw new Error('The translation came back the wrong length.');
    return out.strings;
  }
  async function italianBundle(bundle, onProgress){
    const all = translatableStrings(bundle);
    const map = {};
    const SIZE = 60;
    for(let i = 0; i < all.length; i += SIZE){
      const chunk = all.slice(i, i + SIZE);
      if(onProgress) onProgress(Math.min(i + chunk.length, all.length), all.length);
      const done = await translateChunk(chunk);
      chunk.forEach(function(src, n){ map[src] = done[n]; });
    }
    const t = function(v){
      const s = String(v == null ? '' : v).trim();
      return (s && map[s]) ? map[s] : v;
    };
    // Rebuilt rather than mutated: this planner's own data stays exactly as it
    // is, in whatever mix of languages it is already in.
    const out = JSON.parse(JSON.stringify(bundle));
    out.language = 'it';
    (out.recipes || []).forEach(function(r){
      r.name = t(r.name);
      r.course = t(r.course);
      if(r.type) r.type = t(r.type);
      r.steps = (r.steps || []).map(function(st){
        if(st && typeof st === 'object') return Object.assign({}, st, {text: t(st.text)});
        return t(st);
      });
      if(r.instructions) r.instructions = t(r.instructions);
      (r.items || []).forEach(function(it){
        const nu = nameAndUnit(it.name);
        const unit = unitToItalian(nu.unit);
        it.plainName = t(nu.name);
        it.unit = unit;
        it.name = unit ? it.plainName + ' [' + unit + ']' : it.plainName;
      });
    });
    (out.ingredients || []).forEach(function(i){
      const nu = nameAndUnit(i.name);
      const unit = unitToItalian(nu.unit);
      i.plainName = t(nu.name);
      i.unit = unit;
      i.name = unit ? i.plainName + ' [' + unit + ']' : i.plainName;
    });
    return out;
  }

  function planRecipeImport(data, fileName){
    // Accepts an export from this app, and also a whole backup file, since both
    // carry recipes and ingredients at the top level.
    const recipes = (data && Array.isArray(data.recipes)) ? data.recipes : null;
    if(!recipes || !recipes.length){
      showMessage('No recipes in that file.'); return;
    }
    const ings = (data && Array.isArray(data.ingredients)) ? data.ingredients : [];
    const haveRecipe = {};
    state.recipes.forEach(function(r){ haveRecipe[(r.name || '').trim().toLowerCase()] = true; });
    const haveIng = {};
    state.ingredients.forEach(function(i){ haveIng[(i.name || '').trim().toLowerCase()] = true; });

    const fresh = [], clashes = [];
    recipes.forEach(function(r){
      if(!r || !r.name) return;
      (haveRecipe[String(r.name).trim().toLowerCase()] ? clashes : fresh).push(r);
    });
    // Only the ingredients the incoming recipes actually use, and only new ones.
    const used = {};
    recipes.forEach(function(r){
      (r.items || []).forEach(function(it){
        if(it.recipeId) return;                 // resolved by the bundle's own recipes
        const n = (it.name || '').trim();
        if(n) used[n.toLowerCase()] = true;
      });
    });
    const newIngs = ings.filter(function(i){
      const k = (i.name || '').trim().toLowerCase();
      return k && used[k] && !haveIng[k];
    });
    const missing = Object.keys(used).filter(function(k){
      return !haveIng[k] && !newIngs.some(function(i){ return (i.name || '').trim().toLowerCase() === k; });
    });

  function applyRecipeImport(mode){

    if(!take.length){ showMessage('Nothing to add.'); pendingRecipeFile = null; rerender(); return; }
    pendingRecipeFile = null;
    let added = 0, replaced = 0;
    const inlineArrivals = [];
    update(()=>{
      p.newIngs.forEach(function(i){
        const copy = JSON.parse(JSON.stringify(i));
        copy.id = uid('ing');
        state.ingredients.push(copy);

      const idMap = {};

        // pointing outside this file falls back to being a plain ingredient row.

          it.recipeId = byName ? byName.id : null;

  // On a phone the suggestion list scrolls, so acting on touchstart picked
  // whatever the finger first landed on. Decide on touchend instead, and only
  // when the finger barely moved — otherwise a scroll is a scroll.
  let autocompleteTouch = null;
  function autocompleteTouchStart(e){
    const t = e.touches && e.touches[0];
    autocompleteTouch = t ? {x: t.clientX, y: t.clientY} : null;
  }
  function autocompleteTouchEnd(el, e){
    const start = autocompleteTouch;
    autocompleteTouch = null;
    if(!start) return;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    if(t && (Math.abs(t.clientX - start.x) > 10 || Math.abs(t.clientY - start.y) > 10)) return;  // a scroll
    e.preventDefault();          // stops the ghost mouse event landing elsewhere
    if(el.dataset.name !== undefined) openIngredientEditor(el.dataset.name);
    else selectAutocompleteSuggestion(el);

  function selectAutocompleteSuggestion(el){
    const targetId = el.dataset.target; const val = el.dataset.value;

    ingredientAutocompleteFor = null;

      if(w){
        const row = w.days[ds.day][ds.slot].rows[parseInt(ds.idx,10)];
        if(row) row.name = val;

    } else {
      const r = state.recipes.find(x=>x.id===ds.id);
      if(r){

    // Update in place — a full rerender here would scroll the panel and feel like a reload.

  function renderIngredientAutocomplete(inputId, query){
    if(ingredientAutocompleteFor !== inputId) return '';
    const q = (query||'').trim().toLowerCase();
    let matches = sortedIngredientsList().map(function(i){ return {name: i.name, rid: null}; });

    // Recipes can be used inside other recipes — but only in a recipe, and only
    // when doing so wouldn't make a loop.
    const input = document.getElementById(inputId);
    const hostId = input && input.dataset ? input.dataset.id : null;
    if(hostId && !(input.dataset && input.dataset.week)){
      state.recipes.forEach(function(r){
        if(recipeUses(hostId, r.id)) return;          // itself, or already contains the host
        const y = recipeYield(r);
        matches.push({name: r.name, rid: r.id, yield: y});
      });
    }
    if(q){
      matches = matches.filter(function(i){ return i.name.toLowerCase().indexOf(q)!==-1; });
    }
    matches.sort(function(a,b){
      if(q){
        const as = a.name.toLowerCase().indexOf(q) === 0 ? 0 : 1;
        const bs = b.name.toLowerCase().indexOf(q) === 0 ? 0 : 1;
        if(as !== bs) return as - bs;
      }
      return a.name.localeCompare(b.name);
    });
    matches = matches.slice(0, 40);
    if(!matches.length){
      const createBtn = q
        ? '<div class="mp-autocomplete-item mp-autocomplete-create" onmousedown="openIngredientEditor(this.dataset.name)" ontouchstart="autocompleteTouchStart(event)" ontouchend="autocompleteTouchEnd(this, event)" data-name="' + esc((query||'').trim()) + '">+ Create &ldquo;' + esc((query||'').trim()) + '&rdquo;</div>'
        : '';
      return '<div class="mp-autocomplete-list" id="autocomplete-dropdown"><div class="mp-autocomplete-empty">No matches</div>' + createBtn + '</div>';
    }
    return '<div class="mp-autocomplete-list" id="autocomplete-dropdown">' + matches.map(function(i){
      const tag = i.rid
        ? '<span class="mp-ac-recipe">recipe &middot; ' + esc(String(i.yield.amount) + ' ' + i.yield.unit) + '</span>'
        : '';
      return '<div class="mp-autocomplete-item' + (i.rid ? ' mp-ac-is-recipe' : '') + '" data-target="' + inputId + '"' +
        ' data-value="' + esc(i.name) + '"' + (i.rid ? ' data-rid="' + esc(i.rid) + '"' : '') +
        ' onmousedown="selectAutocompleteSuggestion(this)" ontouchstart="autocompleteTouchStart(event)" ontouchend="autocompleteTouchEnd(this, event)">' +
        (i.rid ? '&#127858; ' : '') + esc(i.name) + tag + '</div>';
    }).join('') + '</div>';
  }
  function positionModals(){
    const vv = window.visualViewport;
    const backdrops = document.querySelectorAll('.mp-modal-backdrop');
    const body = document.body;
    if(!backdrops.length){
      body.classList.remove('mp-modal-open');
      return;
    }
    body.classList.add('mp-modal-open');
    backdrops.forEach(function(bd){
      if(!vv){
        bd.style.left = ''; bd.style.top = ''; bd.style.width = ''; bd.style.height = '';
        bd.style.right = ''; bd.style.bottom = '';
        return;
      }
      bd.style.left = vv.offsetLeft + 'px';
      bd.style.top = vv.offsetTop + 'px';
      bd.style.width = vv.width + 'px';
      bd.style.height = vv.height + 'px';
      bd.style.right = 'auto';
      bd.style.bottom = 'auto';

  }

  function positionAutocompleteDropdown(){
    if(!ingredientAutocompleteFor) return;
    const input = document.getElementById(ingredientAutocompleteFor);
    const dropdown = document.getElementById('autocomplete-dropdown');
    if(!input || !dropdown) return;
    const rect = input.getBoundingClientRect();
    const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    const vw = (window.visualViewport ? window.visualViewport.width : window.innerWidth);

    dropdown.style.width = Math.max(rect.width, 160) + 'px';
    // Always below the field — never flip above it.
    dropdown.style.top = (rect.bottom + 3) + 'px';
    const spaceBelow = vh - rect.bottom - 8;
    dropdown.style.maxHeight = Math.max(70, Math.min(200, spaceBelow)) + 'px';

    const width = parseFloat(dropdown.style.width);
    let left = rect.left;
    if(left + width > vw - 6) left = Math.max(6, vw - width - 6);
    dropdown.style.left = left + 'px';
  }
  // A click lands on the nearest common ancestor of where the press began and
  // where it ended. Press inside a modal card, release on the backdrop, and the
  // browser reports a click on the backdrop itself - which used to dismiss the
  // modal and made selecting text to copy almost impossible. So remember where
  // each press started and swallow the click when it did not start on the
  // backdrop. A press recorded nowhere (a programmatic or keyboard click) is
  // left alone and still closes.
  let modalPressTarget = null;
  function notePress(e){ modalPressTarget = e.target || null; }
  document.addEventListener('mousedown', notePress, true);
  document.addEventListener('touchstart', notePress, true);
  function isBackdrop(el){
    return !!(el && el.classList && el.classList.contains('mp-modal-backdrop'));
  }
  document.addEventListener('click', function(e){
    const press = modalPressTarget;
    modalPressTarget = null;              // every click consumes the record
    if(!isBackdrop(e.target)) return;     // inside the card: nothing to do
    if(!press) return;                    // no press seen: behave as before
    if(isBackdrop(press)) return;         // a real click on the backdrop
    e.stopPropagation();                  // a drag that began inside the card
    e.preventDefault();
  }, true);
  document.addEventListener('click', function(e){
    if(openMealMenu && !e.target.closest('.mp-meal-menu-wrap')){

  function autoSizeRecipeNames(){
    const els = document.querySelectorAll('.mp-recipe-name, .mp-recipe-instructions-input, .mp-step-input');
    if(!els.length) return;
    els.forEach(function(el){ el.style.height = 'auto'; });
    // These boxes are border-box, so a height of exactly scrollHeight eats the
    // borders out of the text — which is how the title used to come out with
    // its last line shaved off. Read everything first, then write, so the
    // measurements are not invalidated one element at a time.
    const heights = Array.prototype.map.call(els, function(el){
      const cs = window.getComputedStyle(el);
      const borders = (parseFloat(cs.borderTopWidth) || 0) + (parseFloat(cs.borderBottomWidth) || 0);
      return el.scrollHeight + borders;
    });
    els.forEach(function(el, i){ el.style.height = heights[i] + 'px'; });
  }
