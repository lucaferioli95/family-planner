  function exportBackup(){
    try {
      const json = JSON.stringify(state, null, 2);
      const blob = new Blob([json], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = toISODate(new Date());
      a.href = url;
      a.download = 'meal-planner-backup-' + stamp + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      showMessage('Backup downloaded.');
    } catch(err){
      console.error('Backup failed', err);
      showMessage('Could not create backup file.');
    }
  }
  function importBackup(input){
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try {
        const parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== 'object' || !parsed.ingredients){
          showMessage('That file doesn\'t look like a planner backup.');
          return;
        }
        update(()=>{
          Object.keys(state).forEach(function(k){ delete state[k]; });
          Object.assign(state, parsed);
          migrateState();
        });
        showMessage('Backup restored.');
      } catch(err){
        console.error('Restore failed', err);
        showMessage('Could not read that file.');
      }
      input.value = '';
    };
    reader.readAsText(file);
  }

  // ---------- render ----------
  // Drawn rather than linked: 30px of SVG is smaller than the request would be,
  // and it can never arrive late or broken.
  function renderHeader(){
    const map = {pending:'Editing…', saving:'Saving…', saved:'', error:'Could not save — tap to retry'};
    const clickable = currentSaveStatus === 'error';
    return '<header class="mp-header">' +
      '<div class="mp-brand"><h1 class="mp-title">Family meal planner</h1></div>' +
      '<div class="mp-header-right">' +
        '<button type="button" class="mp-save-status ' + currentSaveStatus + '" id="save-status" onclick="retrySaveNow()" ' + (clickable?'':'style="cursor:default"') + '>' + (map[currentSaveStatus] || '') + '</button>' +
        (signedIn()
          ? '<button type="button" class="mp-account-chip" id="account-chip" onclick="openAccount()" title="' + esc(myEmail()) + '">' + esc(accountInitial()) + '</button>'
          : '') +
      '</div>' +
    '</header>';
  }
  function renderTabs(){
    const tabs = [['planner','Planner'],['ingredients','Ingredients'],['recipes','Recipes'],['shopping','Shopping'],['settings','Settings']];
    return '<nav class="mp-tabs">' + tabs.map(function(t){
      return '<button type="button" class="mp-tab ' + (state.activeTab===t[0]?'active':'') + '" onclick="setTab(\'' + t[0] + '\')">' + t[1] + '</button>';
    }).join('') + '</nav>';
  }
  function weekDropdownLabel(w){
    if(!w.weekStart) return w.label;
    const start = parseISODate(w.weekStart);
    const end = addDays(start, 6);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const sameMonth = start.getMonth() === end.getMonth();
    const left = start.getDate() + (sameMonth ? '' : ' ' + months[start.getMonth()]);
    const right = end.getDate() + ' ' + months[end.getMonth()];
    // The year only earns its place when it is not this one — it is what
    // pushes "28 Sep–4 Oct 2026 · past" past the width of the control.
    const yr = end.getFullYear();
    return left + '–' + right + (yr === new Date().getFullYear() ? '' : ' ' + yr);
  }
  function renderWeekTabs(){
    const today = toISODate(new Date());
    const weeksNewestFirst = sortedWeeks().slice().reverse();
    const activeWeek = state.weeks.find(function(w){ return w.id === state.activeWeekId; }) || weeksNewestFirst[0];

    if(editingWeekId && state.weeks.some(function(w){ return w.id === editingWeekId; })){
      const w = state.weeks.find(function(x){ return x.id === editingWeekId; });
      return '<div class="mp-week-bar">' +
        '<input type="text" class="mp-week-tab-edit" id="weekedit_' + w.id + '" data-id="' + w.id + '" value="' + esc(w.label) + '" onblur="commitRenameWeek(this)" onkeydown="renameWeekKeydown(this, event)">' +
      '</div>';
    }

    return '<div class="mp-week-bar">' + renderWeekPickBtn(activeWeek) + '</div>';
  }
  function renderWeekPickBtn(activeWeek){
    if(!activeWeek) activeWeek = state.weeks.find(function(w){ return w.id === state.activeWeekId; }) || state.weeks[0];
    return '<button type="button" class="mp-week-pick" onclick="openCal()" aria-label="Choose a week">' +
      '<span aria-hidden="true">&#128197;</span> <span class="mp-week-pick-label">' + esc(activeWeek ? weekDropdownLabel(activeWeek) : 'Choose a week') + '</span>' +
    '</button>';
  }
  // ---------- calendar week picker ----------
  let calOpen = false, calMonth = null;
  const MONTH_NAMES_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function weekStartKey(w){ return w.weekStart ? toISODate(mondayOf(parseISODate(w.weekStart))) : null; }
  function openCal(){
    const w = state.weeks.find(function(x){ return x.id === state.activeWeekId; }) || state.weeks[0];
    const base = (w && w.weekStart) ? addDays(parseISODate(w.weekStart), 3) : new Date();
    calMonth = toISODate(new Date(base.getFullYear(), base.getMonth(), 1));
    calOpen = true; rerender();
  }
  function closeCal(){ calOpen = false; rerender(); }
  function calNav(n){
    const d = parseISODate(calMonth);
    calMonth = toISODate(new Date(d.getFullYear(), d.getMonth() + n, 1));
    rerender();
  }
  function calToday(){
    const t = new Date();
    calMonth = toISODate(new Date(t.getFullYear(), t.getMonth(), 1));
    rerender();
  }
  function calPickWeek(el){
    const start = el.dataset.start;
    const w = state.weeks.find(function(x){ return weekStartKey(x) === start; });
    calOpen = false;
    if(w){ setActiveWeek(w.id); return; }
    pendingNewWeek = {mode: 'choose', weekStart: start, wd: defaultWorkDays(), plan: null};
    rerender();
  }
  function calPickLegacy(el){ calOpen = false; setActiveWeek(el.dataset.id); }
  function renderCalendarPopup(){
    if(!calOpen || !calMonth) return '';
    const first = parseISODate(calMonth);
    const today = toISODate(new Date());
    const active = state.weeks.find(function(x){ return x.id === state.activeWeekId; });
    const activeKey = active ? weekStartKey(active) : null;
    const have = {};
    state.weeks.forEach(function(w){ const k = weekStartKey(w); if(k) have[k] = w; });
    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
    let cur = mondayOf(first);
    let rows = '';
    while(cur <= last){
      const key = toISODate(cur);
      const end = toISODate(addDays(cur, 6));
      const cells = [];
      for(let i = 0; i < 7; i++){
        const d = addDays(cur, i), iso = toISODate(d);
        cells.push('<span class="mp-cal-day' + (d.getMonth() !== first.getMonth() ? ' mp-cal-out' : '') + (iso === today ? ' mp-cal-today' : '') + '">' + d.getDate() + '</span>');
      }
      const cls = 'mp-cal-week' + (have[key] ? ' mp-cal-has' : '') + (key === activeKey ? ' mp-cal-active' : '') + ((key <= today && end >= today) ? ' mp-cal-now' : '');
      rows += '<button type="button" class="' + cls + '" data-start="' + key + '" onclick="calPickWeek(this)" aria-label="Week of ' + key + '">' + cells.join('') +
        '<span class="mp-cal-mark">' + (have[key] ? '&#9679;' : '') + '</span></button>';
      cur = addDays(cur, 7);
    }
    const legacy = state.weeks.filter(function(w){ return !w.weekStart; }).map(function(w){
      return '<button type="button" class="mp-week-add" data-id="' + w.id + '" onclick="calPickLegacy(this)">' + esc(w.label) + '</button>';
    }).join('');
    const sure = active && pendingDelete === ('week:' + active.id);
    const actions = active ? ('<div class="mp-cal-actions">' +
      '<button type="button" class="mp-week-add" onclick="calOpen=false; startRenameWeek(\'' + active.id + '\')">&#9998; Rename</button>' +
      '<button type="button" class="mp-week-add" onclick="calOpen=false; duplicateWeek(\'' + active.id + '\')">&#10697; Copy to next week</button>' +
      '<button type="button" class="mp-week-add ' + (sure ? 'mp-confirm' : '') + '" onclick="deleteWeek(\'' + active.id + '\')">' + (sure ? 'Sure?' : '&times; Delete week') + '</button>' +
    '</div>') : '';
    return '<div class="mp-modal-backdrop" onclick="closeCal()">' +
      '<div class="mp-modal-card mp-cal-card" onclick="event.stopPropagation()">' +
        '<div class="mp-cal-head">' +
          '<button type="button" class="mp-icon-btn" onclick="calNav(-1)" aria-label="Previous month">&#8249;</button>' +
          '<strong class="mp-cal-title">' + MONTH_NAMES_LONG[first.getMonth()] + ' ' + first.getFullYear() + '</strong>' +
          '<button type="button" class="mp-icon-btn" onclick="calNav(1)" aria-label="Next month">&#8250;</button>' +
        '</div>' +
        '<div class="mp-cal-dow">' + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(d){ return '<span>' + d.charAt(0) + '</span>'; }).join('') + '<span></span></div>' +
        '<div class="mp-cal-grid">' + rows + '</div>' +
        '<button type="button" class="mp-modal-cancel" onclick="closeCal()">Close</button>' +
      '</div>' +
    '</div>';
  }
  function renderRow(week, day, slot, row, idx){
    const found = findIngredient(row.name);
    const unresolved = row.name && String(row.name).trim() && !found;
    const baseId = week.id + '_' + day + '_' + slot + '_' + idx;

        '<input type="text" class="mp-row-name" id="' + nameInputId + '" ' +
          'data-week="' + week.id + '" data-day="' + day + '" data-slot="' + slot + '" data-idx="' + idx + '" data-field="name" ' +
          'value="' + esc(row.name) + '" placeholder="Ingredient" autocomplete="off" oninput="onRowFieldChange(this)" onfocus="onIngredientNameFocus(this)" onblur="onIngredientNameBlur(this)">' +
        renderIngredientAutocomplete(nameInputId, row.name) +
      '</div>' +
      '<input type="text" inputmode="decimal" class="mp-row-portion" id="rp_' + baseId + '" ' +
        'data-week="' + week.id + '" data-day="' + day + '" data-slot="' + slot + '" data-idx="' + idx + '" data-field="portion" ' +
        'value="' + esc(row.portion===''||row.portion==null?'':row.portion) + '" placeholder="qty" oninput="onRowFieldChange(this)">' +
      '<button type="button" class="mp-row-del" title="Remove" data-week="' + week.id + '" data-day="' + day + '" data-slot="' + slot + '" data-idx="' + idx + '" onclick="removeRow(this)">&times;</button>' +
    '</div>';

  function renderSkipShoppingBtn(week, day, slot, choice){
    const active = !!choice.skipShopping;
    return '<button type="button" class="mp-icon-btn mp-skip-btn ' + (active?'mp-skip-active':'') + '" onclick="event.stopPropagation(); toggleSkipShopping(this)" data-week="' + week.id + '" data-day="' + day + '" data-slot="' + slot + '" data-choice="' + choice.id + '" title="' + (active?'Excluded from shopping list — still counted in nutrition. Tap to include again.':'Already have it? Exclude from the shopping list (still counts toward nutrition)') + '">&#10052;</button>';
  }
  function renderMealBlock(week, day, slot, choice, allRows){
    const isOpen = !!expandedMeals[choice.id];
    const matchedRecipe = !choice.standalone ? state.recipes.find(function(r){ return r.name === choice.name; }) : null;
    let body = '';
    if(isOpen){
      const rowItems = [];
      allRows.forEach(function(row, idx){
        if(row.choiceId === choice.id) rowItems.push({row: row, idx: idx});
      });
      body = renderRowsWithHiddenToggle(week, day, slot, rowItems, 'hidden_' + choice.id);
      if(!body) body = '<p class="mp-empty-mini">No ingredients in this meal.</p>';
    }
    const menuOpen = openMealMenu === choice.id;
    const skipOn = !!choice.skipShopping;
    const menu = menuOpen
      ? '<div class="mp-meal-menu" onclick="event.stopPropagation()">' +
          '<button type="button" class="mp-meal-menu-item" onclick="closeMealMenu(); toggleMealExpanded(\'' + choice.id + '\')">&#9878; ' + (isOpen ? 'Hide the quantities' : 'Adjust recipe') + '</button>' +
          (!choice.standalone ? '<button type="button" class="mp-meal-menu-item" data-week="' + week.id + '" data-day="' + day + '" data-slot="' + slot + '" data-choice="' + choice.id + '" onclick="closeMealMenu(); openMealReplace(this)">&#128260; Replace recipe</button>' : '') +
          '<button type="button" class="mp-meal-menu-item" data-name="' + esc(choice.name) + '" onclick="closeMealMenu(); copyRecipeName(this)">&#128203; Copy name</button>' +
          '<button type="button" class="mp-meal-menu-item ' + (skipOn?'mp-meal-menu-on':'') + '" data-week="' + week.id + '" data-day="' + day + '" data-slot="' + slot + '" data-choice="' + choice.id + '" onclick="closeMealMenu(); toggleSkipShopping(this)">&#10052; ' + (skipOn?'Add back to shopping':'Already have it') + '</button>' +
          '<button type="button" class="mp-meal-menu-item mp-meal-menu-danger" data-week="' + week.id + '" data-day="' + day + '" data-slot="' + slot + '" data-choice="' + choice.id + '" onclick="closeMealMenu(); removeMealChoice(this)">&times; Remove meal</button>' +
        '</div>'
      : '';
    return swipeWrapOpen(week, day, slot, choice) + '<div class="mp-meal-block ' + (choice.skipShopping?'mp-meal-block-skip':'') + '">' +
      // Tapping a planned meal is almost always "how do I make this?", not
      // "let me edit the grams". The quantities moved into the dots menu.
      '<div class="mp-meal-block-head"' +
        (matchedRecipe
          ? ' data-rid="' + matchedRecipe.id + '" data-people="' + esc((choice.people||[]).join(',')) + '" onclick="openCookView(this)"'
          : ' onclick="toggleMealExpanded(\'' + choice.id + '\')"') + '>' +
        (isOpen ? '<span class="mp-meal-chevron">&#9662;</span>' : '') +
        '<span class="mp-meal-block-name">' + esc(choice.name) + '</span>' +
        (skipOn ? '<span class="mp-skip-flag" title="Excluded from the shopping list">&#10052;</span>' : '') +
        '<span class="mp-meal-menu-wrap">' +
          '<button type="button" class="mp-icon-btn mp-meal-dots" onclick="event.stopPropagation(); toggleMealMenu(\'' + choice.id + '\')" title="More">&#8942;</button>' +
          menu +
        '</span>' +
      '</div>' +
      (isOpen ? '<div class="mp-meal-block-body">' + body + '</div>' : '') +
      renderLeftoverAsk(choice) +
    '</div></div>';
  }
  function swipeWrapOpen(week, day, slot, choice){

  function renderLeftoverAsk(choice){

  const PICKER_SLOT_LABELS = {Breakfast:'Breakfast', Snack:'Snack 1', Lunch:'Lunch', Snack2:'Snack 2', Dinner:'Dinner'};
  function renderSlot(week, day, slot){
    const slotData = week.days[day][slot];
    const choices = slotData.choices || [];
    const allRows = slotData.rows;

    const relevantChoices = choices.filter(function(c){
      const p = c.people || allPersonIds();
      return p.indexOf(plannerPersonView) !== -1;
    });
    const sectionHtml = relevantChoices.map(function(c){
      return c.standalone ? renderStandaloneChoice(week, day, slot, c, allRows) : renderMealBlock(week, day, slot, c, allRows);
    }).join('');

    let extraRowItems = [];
    allRows.forEach(function(row, idx){ if(!row.choiceId) extraRowItems.push({row: row, idx: idx}); });
    const extraRows = extraRowItems.length ? renderRowsWithHiddenToggle(week, day, slot, extraRowItems, 'hidden_extras_' + week.id + '_' + day + '_' + slot) : '';
    const extras = extraRows ? ('<div class="mp-slot-extras">' + extraRows + '</div>') : '';

    if(!sectionHtml && !extras) return '';

    return '<div class="mp-slot">' +
      '<div class="mp-slot-head"><span class="mp-slot-name">' + esc(SLOT_LABELS[slot]||slot) + '</span></div>' +
      sectionHtml + extras +
    '</div>';

  function renderNutritionLabel(totals, title){

      rows += '<div class="mp-nl-row"><span class="mp-nl-label">' + n.label + '</span>' +
        '<span class="mp-nl-value">' + val.toFixed(1) + ' ' + n.unit + '</span>' +
        '<span class="mp-nl-pct ' + pctClass(pct) + '">' + Math.round(pct) + '%</span></div>';
    });
    return '<div class="mp-nutrition-label"><p class="mp-nl-title">' + title + '</p><div class="mp-nl-rule-thick"></div>' + rows + '</div>';
  }
  const DAY_CLASS = {Mon:'mp-day-mon', Tue:'mp-day-tue', Wed:'mp-day-wed', Thu:'mp-day-thu', Fri:'mp-day-fri', Sat:'mp-day-sat', Sun:'mp-day-sun'};

  function renderDayMealAddPopup(){
    if(!pendingDayMealAdd) return '';
    const info = pendingDayMealAdd;
    const step = info.step || 1;

    let summaryParts = [];
    if(step > 1 && info.people.length) summaryParts.push(info.people.map(personName).join(' + '));
    if(step > 2 && info.slot) summaryParts.push(PICKER_SLOT_LABELS[info.slot]);
    if(step > 2 && info.days.length > 1) summaryParts.push(info.days.length + ' days');
    const summary = summaryParts.length ? ('<p class="mp-daymeal-summary">' + summaryParts.map(esc).join(' · ') + '</p>') : '';

    let title = 'Who is it for?';
    let stepBody = '';

    if(step === 1){
      const personButtons = people().map(function(p){
        const on = info.people.indexOf(p.id) !== -1;

    } else if(step === 2){

      return '<div class="mp-tr-row ' + (same ? 'mp-tr-same' : '') + (merging ? ' mp-tr-merge' : '') + '">' +

            '. Marked below.</p>' : '') +

        '<div class="mp-suit-row" style="margin-top:10px;">' +
          '<button type="button" class="mp-week-add" onclick="exportBackup()" title="A full backup \u2014 recipes, ingredients and every planned week \u2014 exactly as they are right now">&#11015; Back everything up first</button>' +

  // ---------- swipe left to delete a meal (list view) ----------
  let SW = null, swSuppressUntil = 0, swLast = null, swUndoTimer = null;
  function swDelete(wrap){
    const ds = wrap.dataset;
    const w = state.weeks.find(function(x){ return x.id === ds.week; }); if(!w) return;
    const slotObj = w.days[ds.day][ds.slot];
    const ci = (slotObj.choices || []).findIndex(function(c){ return c.id === ds.choice; }); if(ci < 0) return;
    const choice = slotObj.choices[ci];
    const rows = [];
    slotObj.rows.forEach(function(r, i){ if(r.choiceId === ds.choice) rows.push({row: JSON.parse(JSON.stringify(r)), idx: i}); });
    swLast = {week: ds.week, day: ds.day, slot: ds.slot, choice: JSON.parse(JSON.stringify(choice)), ci: ci, rows: rows, name: ds.name};
    update(()=>{
      slotObj.choices = slotObj.choices.filter(function(c){ return c.id !== ds.choice; });
      slotObj.rows = slotObj.rows.filter(function(r){ return r.choiceId !== ds.choice; });
    });
    showUndoBar('Removed “' + (ds.name || 'meal') + '”');
  }
  function swipeDeleteBtn(el){ const wrap = el.closest('.mp-sw-wrap'); if(wrap) swDelete(wrap); }
  function showUndoBar(text){
    let bar = document.getElementById('mp-undo-bar');
    if(!bar){ bar = document.createElement('div'); bar.id = 'mp-undo-bar'; bar.className = 'mp-undo-bar'; document.body.appendChild(bar); }
    bar.innerHTML = '<span></span><button type="button" onclick="undoSwipeDelete()">Undo</button>';
    bar.firstChild.textContent = text;
    bar.hidden = false;
    if(swUndoTimer) clearTimeout(swUndoTimer);
    swUndoTimer = setTimeout(function(){ bar.hidden = true; swLast = null; }, 6000);
  }
  function undoSwipeDelete(){
    const bar = document.getElementById('mp-undo-bar'); if(bar) bar.hidden = true;
    const L = swLast; swLast = null; if(!L) return;
    const w = state.weeks.find(function(x){ return x.id === L.week; }); if(!w) return;
    const slotObj = w.days[L.day][L.slot];
    update(()=>{
      slotObj.choices.splice(Math.min(L.ci, slotObj.choices.length), 0, L.choice);
      L.rows.slice().sort(function(a, b){ return a.idx - b.idx; }).forEach(function(x){ slotObj.rows.splice(Math.min(x.idx, slotObj.rows.length), 0, x.row); });
    });
  }
  function swClose(except){
    document.querySelectorAll('.mp-sw-wrap.sw-open').forEach(function(w){
      if(w === except) return;
      w.classList.remove('sw-open', 'sw-on');
      const b = w.children[1]; if(b){ b.style.transition = 'transform .18s'; b.style.transform = ''; }
    });
  }
  document.addEventListener('pointerdown', function(e){
    const wrap = e.target.closest && e.target.closest('.mp-sw-wrap');
    if(!wrap || e.target.closest('.mp-sw-bg')){ swClose(null); return; }
    if(e.pointerType === 'mouse' || wrap.closest('.mp-days-slides')) return;
    if(e.target.closest('button, .mp-meal-menu')) { swClose(wrap); return; }
    swClose(wrap);
    const block = wrap.children[1]; if(!block) return;
    SW = {wrap: wrap, block: block, id: e.pointerId, x: e.clientX, y: e.clientY, active: false, w: wrap.offsetWidth, base: wrap.classList.contains('sw-open') ? -88 : 0, t: 0};
  });
  document.addEventListener('pointermove', function(e){
    if(!SW || e.pointerId !== SW.id) return;
    const dx = e.clientX - SW.x, dy = e.clientY - SW.y;
    if(!SW.active){
      if(Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ SW = null; return; }
      if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.5){
        SW.active = true; SW.wrap.classList.add('sw-on'); SW.block.style.transition = 'none';
        try { SW.block.setPointerCapture(e.pointerId); } catch(x){}
      } else return;
    }
    SW.t = Math.max(-SW.w, Math.min(0, SW.base + dx));
    SW.block.style.transform = 'translateX(' + SW.t + 'px)';
  });
  function swEnd(e, cancel){
    if(!SW || e.pointerId !== SW.id) return;
    const S = SW; SW = null;
    if(!S.active) return;
    swSuppressUntil = Date.now() + 350;
    S.block.style.transition = 'transform .18s';
    if(!cancel && S.t < -S.w * 0.55){
      S.block.style.transform = 'translateX(-' + S.w + 'px)';
      setTimeout(function(){ swDelete(S.wrap); }, 160);
    } else if(!cancel && S.t < -44){
      S.block.style.transform = 'translateX(-88px)'; S.wrap.classList.add('sw-open');
    } else {
      S.block.style.transform = ''; S.wrap.classList.remove('sw-open', 'sw-on');
    }
  }
  document.addEventListener('pointerup', function(e){ swEnd(e, false); });
  document.addEventListener('pointercancel', function(e){ swEnd(e, true); });
  document.addEventListener('click', function(e){
    if(Date.now() < swSuppressUntil && e.target.closest && e.target.closest('.mp-sw-wrap')){ e.stopPropagation(); e.preventDefault(); }
  }, true);
  function toggleSlides(){

  function slideRow(){ return document.querySelector('.mp-days-slides'); }
  function goSlide(i){
    const row = slideRow(); if(!row) return;
    const card = row.children[i]; if(!card) return;
    row.scrollTo({left: card.offsetLeft - row.offsetLeft - (row.clientWidth - card.offsetWidth) / 2, behavior: 'smooth'});
  }
  function slideIndex(row){
    let best = 0, bestD = 1e9;
    Array.prototype.forEach.call(row.children, function(c, i){
      const d = Math.abs((c.offsetLeft - row.offsetLeft + c.offsetWidth / 2) - (row.scrollLeft + row.clientWidth / 2));
      if(d < bestD){ bestD = d; best = i; }
    });
    return best;
  }
  function paintSlidePager(){
    const row = slideRow(); if(!row) return;
    const idx = slideIndex(row);
    document.querySelectorAll('.mp-slide-pill').forEach(function(p){
      const on = parseInt(p.dataset.i, 10) === idx;
      p.classList.toggle('active', on);
      if(on && p.scrollIntoView) { try { p.scrollIntoView({block:'nearest', inline:'center'}); } catch(e){} }
    });
  }
  function initSlides(){

    const week = state.weeks.find(function(w){ return w.id === state.activeWeekId; }) || state.weeks[0];
    if(week && slideAutoWeek !== week.id){
      slideAutoWeek = week.id;

  let ingQuery = '';
  function plainText(t){ return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function ingredientUses(week, query){
    const words = plainText(query).split(/\s+/).filter(Boolean);
    const out = {};
    if(!words.length) return [];
    DAYS.forEach(function(d){
      SLOTS.forEach(function(s){
        const slotObj = week.days[d][s]; if(!slotObj) return;
        (slotObj.rows || []).forEach(function(r){
          const nu = nameAndUnit(r.name);
          const hay = plainText(nu.name);
          if(!words.every(function(w){ return hay.indexOf(w) !== -1; })) return;
          let multiplier = 1, choice = null;
          if(r.choiceId){
            choice = (slotObj.choices || []).find(function(c){ return c.id === r.choiceId; }) || null;
            if(choice){
              const recipe = !choice.standalone ? state.recipes.find(function(rec){ return rec.name === choice.name; }) : null;
              multiplier = (recipe && recipe.batchCook) ? (num(recipe.batchMultiplier) || 1) : ((choice.people && choice.people.length) || 1);
            }
          }
          const p = typeof r.portion === 'number' ? r.portion : parseFloat(r.portion);
          const key = (r.name || '').trim();
          if(!out[key]) out[key] = {name: nu.name, unit: nu.unit, total: 0, uses: []};
          const used = (isNaN(p) ? 0 : p) * multiplier;
          out[key].total += used;
          out[key].uses.push({day: d, slot: s, meal: choice ? choice.name : '', people: choice && choice.people ? choice.people.map(personName) : [], amount: used});
        });
      });
    });
    return Object.keys(out).sort().map(function(k){ return out[k]; });
  }

    if(!isFinite(n) || n === 0) return '';
    const abs = Math.abs(n);

    const q = Math.round(n * 4) / 4;
    const whole = Math.floor(q);
    const frac = Math.round((q - whole) * 100) / 100;
    if(!frac) return String(whole);
    const glyph = COOK_FRACTIONS[frac];
    if(!glyph) return String(Math.round(n * 100) / 100);
    return (whole ? whole : '') + glyph;

    const comma = dataUrl.indexOf(',');

    const mime = (/^data:([^;,]+)/.exec(dataUrl.slice(0, comma)) || [])[1] || 'image/jpeg';
    try {
      const bin = atob(dataUrl.slice(comma + 1));
      const buf = new Uint8Array(bin.length);

  async function uploadPhoto(dataUrl, hint){

    const blob = dataUrlToBlob(dataUrl);

    const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace(/[^a-z0-9]/g, '');
    const safe = String(hint || 'photo').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'photo';
    const path = safe + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + '.' + ext;
    try {
      const res = await fetch(storageBase() + '/object/' + encodeURIComponent(photoBucket()) + '/' + path, {
        method: 'POST',
        headers: supabaseHeaders({'Content-Type': blob.type, 'x-upsert': 'true'}),
        body: blob
      });
      if(!res.ok){
        // Storage wraps its real status in the body — a permissions refusal
        // arrives as HTTP 400 with {"statusCode":"403"} inside. Trust the body.
        const txt = await res.text().catch(function(){ return ''; });
        let info = {};
        try { info = JSON.parse(txt) || {}; } catch(e){}

        } else if(/bucket not found/i.test(msg) || code === '404'){

  function shrinkDataUrl(dataUrl, maxDim, quality){
    // Always settles. Anything thrown in here — no canvas context, a format the
    // browser won't decode, a toDataURL that runs out of memory on a phone —
    // resolves empty so the caller can fall back to the original image, and a
    // timeout covers an onload that never fires at all.
    return new Promise(function(resolve){
      let done = false;
      function finish(v){ if(done) return; done = true; clearTimeout(timer); resolve(v || ''); }
      // A data: URL decodes about instantly or fails; this only bounds the case
      // where neither onload nor onerror ever fires, so the import can't hang.
      const timer = setTimeout(function(){ finish(''); }, 2500);
      let img;
      try { img = new Image(); } catch(e){ finish(''); return; }
      img.onload = function(){
        try {
          let w = img.width, h = img.height;
          if(!w || !h){ finish(''); return; }
          if(w > maxDim || h > maxDim){ if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; } else { w = Math.round(w * maxDim / h); h = maxDim; } }
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          if(!ctx){ finish(''); return; }
          ctx.drawImage(img, 0, 0, w, h);
          finish(cv.toDataURL('image/jpeg', quality));
        } catch(e){ finish(''); }
      };
      img.onerror = function(){ finish(''); };
      try { img.src = dataUrl; } catch(e){ finish(''); }
    });
  }

  function setImportChoice(el){
    if(!pendingImport || !pendingImport.items) return;

  }
  function cancelImport(){ pendingImport = null; rerender(); }
  async function confirmImport(){
    const p = pendingImport; if(!p || p.status !== 'review') return;
    const r = p.recipe;
    // Put the photo in the bucket before it lands in the saved data.
    if(isInlinePhoto(p.photo)) p.photo = await storePhoto(p.photo, String(r.name || 'recipe'));
    const nameEl = document.getElementById('imp-name');
    const recipeName = ((nameEl && nameEl.value) || r.name || 'Imported recipe').trim();
    const created = [];
    const recipeItems = p.items.map(function(it){
      let name = it.match || it.choice || '';
      if(!name){
        name = it.suggested;
        if(!findIngredient(name)){
          const ingNew = {id: uid('ing'), name: name, refPortion: null, category: '', checked: false, review: false,
                          defaultShopId: null, prepAhead: '', booster: false, boosterMax: ''};
          nutrients().forEach(function(n){ ingNew[n.key] = null; });
          state.ingredients.push(ingNew);
          created.push(name);
        }
      }
      return {name: name, portion: it.portion};
    });
    const valid = function(x){ return MEAL_KINDS.indexOf(x) !== -1; };
    const rec = {
      id: uid('rec'), name: recipeName, link: p.url || '', type: '', favourite: false, batchCook: false, batchMultiplier: 1,
      servings: num(r.servings) || 4, workLunch: false,
      suitableFor: (Array.isArray(r.suitableFor) ? r.suitableFor : []).filter(valid),
      course: courses().indexOf(r.course) !== -1 ? r.course : '',
      instructions: '', prepTime: String(r.prepTime || ''), cookTime: String(r.cookTime || ''), photo: p.photo || '',
      steps: (Array.isArray(r.steps) ? r.steps : []).map(function(t){ return {id: uid('step'), text: String(t)}; }),
      items: recipeItems
    };
    pendingImport = null;
    const existing = state.recipes.find(function(x){ return x.name.trim().toLowerCase() === recipeName.toLowerCase(); });
    if(existing){
      // Same recipe already in the app: fill in what the import brought, never duplicate.
      update(()=>{
        if(rec.photo) existing.photo = rec.photo;
        if(rec.link) existing.link = rec.link;
        if(rec.items.length){ existing.items = rec.items; existing.servings = rec.servings; }  // quantities and servings travel together
        if(rec.steps.length) existing.steps = rec.steps;
        if(rec.prepTime) existing.prepTime = rec.prepTime;
        if(rec.cookTime) existing.cookTime = rec.cookTime;
        if(!(existing.suitableFor || []).length) existing.suitableFor = rec.suitableFor;
        if(!existing.course) existing.course = rec.course;
        openRecipeId = existing.id; recipeModalTab = 'ingredients';
      });
      showMessage('Updated "' + existing.name + '"' + (created.length ? ' — ' + created.length + ' new ingredient' + (created.length>1?'s':'') + ' added' : '') + '.');
      return;
    }
    update(()=>{ state.recipes.push(rec); openRecipeId = rec.id; recipeModalTab = 'ingredients'; });
    showMessage('Imported "' + recipeName + '"' + (created.length ? ' — ' + created.length + ' new ingredient' + (created.length>1?'s':'') + ' added, add their nutrition when you can' : '') + '.');
  }

  // ---------- leftovers ----------
  function leftoverSuggestions(week){
    // A batch-cooked recipe makes more portions than the people eating it. If the
    // same recipe is planned again within the next few days, that later meal can
    // come from leftovers — so suggest marking it "already have it".
    const out = [];
    if(!week) return out;
    const targeted = {};   // meals already suggested as leftovers
    DAYS.forEach(function(d, di){ SLOTS.forEach(function(s, si){
      const so = week.days[d] && week.days[d][s]; if(!so) return;
      (so.choices || []).forEach(function(ch){
        if(ch.standalone || ch.skipShopping) return;
        if(targeted[ch.id]) return;   // eaten from earlier leftovers, so it isn't a fresh batch
        const r = state.recipes.find(function(x){ return x.name === ch.name; });
        if(!r || !r.batchCook) return;
        const made = num(r.batchMultiplier) || 1;
        let spare = made - ((ch.people || []).length || 1);
        if(spare <= 0) return;
        for(let dj = di; dj < DAYS.length && dj <= di + 3 && spare > 0; dj++){
          SLOTS.forEach(function(s2, sj){
            if(spare <= 0) return;
            if(dj === di && sj <= si) return;
            const so2 = week.days[DAYS[dj]][s2]; if(!so2) return;
            (so2.choices || []).forEach(function(c2){
              if(spare <= 0 || c2.standalone || c2.name !== ch.name) return;
              if(c2.skipShopping){ spare -= (c2.people || []).length || 1; return; }   // already eating these leftovers
              if(targeted[c2.id]) return;
              const key = week.id + '|' + c2.id;
              if(leftoverDismissed[key]) return;
              targeted[c2.id] = true;
              out.push({day: DAYS[dj], slot: s2, choiceId: c2.id, recipe: ch.name, fromDay: d,
                        made: made, eating: (ch.people || []).length || 1, key: key});
              spare -= (c2.people || []).length || 1;
            });
          });
        }
      });
    }); });
    return out;
  }

  function filterMealReplaceList(el){

    let shown = 0;
    document.querySelectorAll('.mp-mrp-item').forEach(function(it){
      const hit = !q || it.dataset.name.indexOf(q) !== -1;
      it.style.display = hit ? '' : 'none';
      if(hit) shown++;

  function pickMealReplacement(el){
    const p = pendingMealReplace; if(!p) return;
    const rid = el.dataset.rid;
    pendingMealReplace = null;
    update(()=>{
      const week = state.weeks.find(function(w){ return w.id === p.weekId; }); if(!week) return;
      const so = week.days[p.day] && week.days[p.day][p.slot]; if(!so) return;
      const ch = (so.choices || []).find(function(c){ return c.id === p.choiceId; }); if(!ch) return;
      const r = state.recipes.find(function(x){ return x.id === rid; }); if(!r) return;
      // Keep the entry (and who it is for), swap the dish and its ingredient rows.
      ch.name = r.name;
      so.rows = (so.rows || []).filter(function(row){ return row.choiceId !== ch.id; });
      const servings = num(r.servings) || 1;
      r.items.forEach(function(it){
        const empty = (it.portion === '' || it.portion === null || it.portion === undefined);
        so.rows.push({name: it.name, portion: empty ? '' : (num(it.portion) / servings), choiceId: ch.id});
      });
    });
    showMessage('Meal replaced.');
  }
  function renderMealReplacePicker(){
    const p = pendingMealReplace; if(!p) return '';
    const week = state.weeks.find(function(w){ return w.id === p.weekId; }); if(!week) return '';
    const so = week.days[p.day] && week.days[p.day][p.slot]; if(!so) return '';
    const ch = (so.choices || []).find(function(c){ return c.id === p.choiceId; }); if(!ch) return '';
    const wd = defaultWorkDays();
    const who = (ch.people && ch.people.length) ? ch.people : planPeopleIds();
    const kind = SLOT_KIND[p.slot];
    // Editing by hand, so anything suitable for this meal is fair game — not only
    // Mains, which is all the automatic proposal is allowed to place.
    let cands = state.recipes.filter(function(r){
      return (r.suitableFor||[]).indexOf(kind) !== -1 && r.name !== ch.name;
    });
    if(kind === 'Lunch' && anyWorkLunches() && who.some(function(pid){ return worksOn(wd, pid, p.day); })){
      const wl = cands.filter(function(r){ return r.workLunch; });
      if(wl.length) cands = wl;
    }
    if(!cands.length) cands = state.recipes.filter(function(r){ return r.name !== ch.name; });
    const counts = recipeUsageCounts();
    const byUse = cands.slice().sort(function(a,b){
      const diff = (counts[b.name] || 0) - (counts[a.name] || 0);
      return diff !== 0 ? diff : a.name.localeCompare(b.name);
    });
    const picks = [];
    if(byUse.length){
      const idx = byUse.length >= 3 ? [0, Math.floor((byUse.length - 1) / 2), byUse.length - 1] : byUse.map(function(_, i){ return i; });
      const labels = ['Your regular', 'Every now and then', 'Rarely made'];
      idx.forEach(function(ix, k){
        const r = byUse[ix], n = counts[r.name] || 0;

      });

          '</button>';
        }).join('') + '</div>'
      : '<p class="mp-empty-mini">No other recipes fit this meal.</p>';
    const list = byUse.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).map(function(r){
      return '<button type="button" class="mp-mrp-item mp-rp-item" data-rid="' + r.id + '" data-name="' + esc(r.name.toLowerCase()) + '" onclick="pickMealReplacement(this)">' +
        '<span>' + esc(r.name) + '</span><span class="mp-rp-item-n">' + (counts[r.name] || 0) + '&times;</span></button>';
    }).join('');
    const forWho = (who.length && who.length < planPeopleIds().length) ? ' &middot; ' + esc(who.map(personName).join(' & ')) : '';
    return '<div class="mp-modal-backdrop mp-backdrop-top" onclick="closeMealReplace()">' +
      '<div class="mp-modal-card mp-rp-modal" onclick="event.stopPropagation()">' +
        '<p class="mp-modal-title">Replace ' + esc(ch.name) + forWho + '</p>' +
        '<p class="mp-settings-note">' + esc(p.day) + ' ' + esc((SLOT_LABELS[p.slot] || p.slot).toLowerCase()) +
          '. The ingredients for this meal are swapped too; the shopping list follows.</p>' +
        sugg +
        (byUse.length ? '<input type="text" class="mp-search-input" id="mrp-search" placeholder="Search all ' + byUse.length + ' options…" autocomplete="off" oninput="filterMealReplaceList(this)">' +
          '<div class="mp-rp-list">' + list + '<p class="mp-empty-mini" id="mrp-none" style="display:none;">No matches.</p></div>' : '') +
        '<button type="button" class="mp-modal-cancel" onclick="closeMealReplace()">Cancel</button>' +
      '</div>' +
    '</div>';
  }
  function acceptLeftover(el){
    const week = state.weeks.find(function(w){ return w.id === state.activeWeekId; }) || state.weeks[0];
    if(!week) return;
    const so = week.days[el.dataset.day] && week.days[el.dataset.day][el.dataset.slot]; if(!so) return;

  function prepAheadForWeek(week){
    // Ingredients flagged as needing advance prep, totalled across the week,
    // with the days they're actually needed on.
    if(!week) return [];
    const map = {};
    DAYS.forEach(function(d){
      SLOTS.forEach(function(s){
        const slotObj = week.days[d] && week.days[d][s];
        if(!slotObj) return;
        slotObj.rows.forEach(function(row){
          const name = (row.name||'').trim();
          if(!name) return;
          const ing = findIngredient(name);
          if(!ing || !ing.prepAhead || !ing.prepAhead.trim()) return;
          let mult = 1;
          if(row.choiceId){
            const ch = (slotObj.choices||[]).find(function(x){ return x.id===row.choiceId; });
            if(ch) mult = (ch.people && ch.people.length) || 1;
          }
          if(!map[ing.name]) map[ing.name] = {name: ing.name, note: ing.prepAhead.trim(), total: 0, days: {}};
          map[ing.name].total += num(row.portion) * mult;
          map[ing.name].days[d] = true;
        });
      });
    });
    return Object.keys(map).sort().map(function(k){
      const e = map[k];
      e.dayList = DAYS.filter(function(d){ return e.days[d]; });
      return e;
    });

  function isStandalone(){

  function browserInstallHint(){

    const iOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if(iOS){
      const realSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
      return realSafari
        ? 'On iPad and iPhone there is no install button. Use the Share button, then <strong>Add to Home Screen</strong>.'
        : 'On iPad and iPhone only <strong>Safari</strong> can install an app. Open this page in Safari, then Share &rarr; <strong>Add to Home Screen</strong>. Chrome, Firefox and Edge on iOS cannot do it.';
    }
    if(/SamsungBrowser/.test(ua)) return 'In Samsung Internet: menu &rarr; <strong>Add page to</strong> &rarr; <strong>Home screen</strong>.';
    if(/Firefox|FxiOS/.test(ua)) return 'In Firefox: menu &rarr; <strong>Install</strong> (older versions say Add to Home screen).';
    if(/OPR|Opera/.test(ua)) return 'In Opera: menu &rarr; <strong>Add to</strong> &rarr; <strong>Home screen</strong>.';
    if(/Edg/.test(ua)) return 'In Edge: menu &rarr; <strong>Apps</strong> &rarr; <strong>Install this site as an app</strong>.';
    if(/Chrome|Chromium/.test(ua)) return 'In Chrome: menu &rarr; <strong>Add to Home screen</strong> or <strong>Install app</strong>. If it is greyed out or refuses, run the check below.';
    return 'Look for &ldquo;Install&rdquo; or &ldquo;Add to Home screen&rdquo; in your browser menu.';
  }
  async function runInstallCheck(){
    const out = [];
    function add(ok, label, detail){ out.push({ok: ok, label: label, detail: detail == null ? '' : String(detail)}); }

    add(window.isSecureContext === true, 'Page is served over HTTPS', location.protocol.replace(':',''));

    if(!('serviceWorker' in navigator)){
      add(false, 'Browser supports service workers', 'not supported — this browser cannot install web apps');
    } else {
      let reg = null;
      try { reg = await navigator.serviceWorker.getRegistration(); } catch(e){}
      add(!!reg, 'Service worker registered', reg ? (reg.active ? 'active' : 'installing — reload once') : 'none registered yet, reload the page');
    }

    const link = document.querySelector('link[rel="manifest"]');
    add(!!link, 'Page links a manifest', link ? link.getAttribute('href') : 'missing');
    if(link){
      let m = null;
      try {
        const res = await fetch(link.href, {cache: 'no-store'});
        add(res.ok, 'manifest.json downloads', res.status + (res.ok ? '' : ' — did every file get uploaded?'));
        if(res.ok){
          try { m = await res.json(); add(true, 'manifest.json is valid JSON', ''); }
          catch(e){ add(false, 'manifest.json is valid JSON', e.message); }
        }
      } catch(e){
        add(false, 'manifest.json downloads', e.message);
      }
      if(m){
        add(!!(m.name || m.short_name), 'Manifest has a name', m.name || m.short_name || '');
        add(!!m.start_url, 'Manifest has a start_url', m.start_url || '');
        add(['standalone','fullscreen','minimal-ui'].indexOf(m.display) !== -1, 'Display mode allows installing', m.display || 'browser');
        const icons = Array.isArray(m.icons) ? m.icons : [];
        const big = icons.filter(function(i){
          return String(i.sizes || '').split(/\s+/).some(function(s){ return parseInt(s, 10) >= 192; });
        });
        add(big.length > 0, 'Manifest lists an icon 192px or larger', big.length + ' of ' + icons.length);
        const anyPurpose = icons.some(function(i){
          const p = String(i.purpose == null ? 'any' : i.purpose);
          return p.split(/\s+/).indexOf('any') !== -1;
        });
        add(anyPurpose, 'An icon is usable as a normal app icon', anyPurpose ? '' : 'every icon is maskable-only');
        // The usual culprit: only index.html was uploaded, so the icons 404.
        const seen = {};
        for(const ic of icons){
          const href = new URL(ic.src, link.href).href;
          if(seen[href]) continue;
          seen[href] = true;
          try {
            const r = await fetch(href, {cache: 'no-store'});
            add(r.ok, 'Icon ' + ic.src + ' downloads', r.ok ? '' : r.status + ' — file missing from the site');
          } catch(e){
            add(false, 'Icon ' + ic.src + ' downloads', 'failed');
          }
        }
      }
    }

    if(isStandalone()){
      add(true, 'You are already running the installed app', 'nothing more to do');
    } else if(deferredInstall){
      add(true, 'Browser has offered the install prompt', 'use the button above');
    } else {
      add(false, 'Browser has offered the install prompt',
          'not offered — if everything above passes, it is usually already installed, or this browser installs from its own menu');
    }

    installReport = out;
    rerender();
  }

  function chooseUsdaFood(el){

  function usdaValues(){
    // per100 is in milligrams; convert into each column's own unit.
    const p = pendingUsda;
    if(!p || !p.food) return [];
    const g = num(p.grams);
    return nutrients().map(function(n){
      const mgPer100 = p.food.per100g ? p.food.per100g[n.key] : undefined;
      if(mgPer100 === null || mgPer100 === undefined) return {key: n.key, label: n.label, unit: n.unit, value: null};
      const mg = mgPer100 * (g / 100);
      const u = (n.unit || '').toLowerCase();
      let v = mg;
      if(u === 'g') v = mg / 1000;
      else if(u === 'mcg' || u === 'µg' || u === 'ug') v = mg * 1000;

      body = '<p class="mp-settings-note"><strong>' + esc(p.food.description) + '</strong> <em>' + esc(p.food.dataType || '') + '</em></p>' +
        '<label class="mp-ing-field"><span>Weight of ' + esc(String(ing.refPortion || 1)) + ' ' + esc(unit) + '</span>' +
          '<input type="text" inputmode="decimal" id="usda-grams" value="' + esc(p.grams || '') + '" placeholder="grams" oninput="setUsdaGrams(this)"> <span style="flex:0 0 auto;">g</span></label>' +
        (p.assumedMl ? '<p class="mp-settings-note">Taken as 1 ml = 1 g; change it if this is an oil or similar.</p>' : '') +
        (!p.grams ? '<p class="mp-settings-note">USDA figures are per 100 g, so this is how the values get scaled to your reference portion.</p>' : '') +
        '<div class="mp-chk-list" id="usda-preview">' + usdaPreviewRows() + '</div>' +
        '<p class="mp-settings-note" style="margin-top:8px;">Anything marked <em>not in USDA</em> is left exactly as it is.</p>';
      actions = '<button type="button" class="mp-modal-btn mp-modal-btn-primary mp-daymeal-add-btn" onclick="applyUsda()">Use these values</button>' +
        '<button type="button" class="mp-week-add mp-daymeal-add-btn" style="margin-top:6px;" onclick="backToUsdaResults()">Pick a different food</button>';
    }
    return '<div class="mp-modal-backdrop mp-backdrop-top" onclick="' + (p.status === 'loading' ? '' : 'closeUsda()') + '">' +
      '<div class="mp-modal-card mp-recipe-modal" onclick="event.stopPropagation()">' +
        '<p class="mp-modal-title">USDA nutrition &middot; ' + esc(ing.name) + '</p>' +
        '<div class="mp-recipe-panel">' + body + '</div>' + actions +
        (p.status === 'loading' ? '' : '<button type="button" class="mp-modal-cancel" onclick="closeUsda()">Cancel</button>') +
      '</div>' +
    '</div>';
  }
  function backToUsdaSearch(){
    if(!pendingUsda) return;
    pendingUsda = {id: pendingUsda.id, status: 'search', query: pendingUsda.query, error: ''};
    rerender();
    focusById('usda-q');
  }
  function backToUsdaResults(){
    if(!pendingUsda || !pendingUsda.results) return;
    pendingUsda = {id: pendingUsda.id, status: 'results', query: pendingUsda.query, results: pendingUsda.results};
    rerender();
  }
  function renderPhotoSection(){
    const n = inlinePhotoCount();
    const kb = Math.round(state.recipes.reduce(function(a, r){
      return a + (isInlinePhoto(r.photo) ? r.photo.length : 0); }, 0) / 1024);
    const m = photoMigration;
    return settingsSection('photos', 'Recipe photos',
      '<p class="mp-settings-note">A photo stored in the app travels with every save and every nightly backup. Moving them to a Supabase bucket leaves just a link behind. New photos go there automatically.</p>' +
      '<label class="mp-ing-field"><span>Bucket name</span>' +
        '<input type="text" id="photo-bucket" value="' + esc(photoBucket()) + '" placeholder="' + DEFAULT_PHOTO_BUCKET + '" autocapitalize="none" autocorrect="off" spellcheck="false" oninput="onPhotoBucketChange(this)"></label>' +
      '<p class="mp-settings-note" style="margin-top:6px;">It must be a <strong>public</strong> bucket, and it needs a policy letting the anon role upload — without one every upload comes back 403 and the photo just stays in the app.</p>' +
      (n
        ? '<p class="mp-settings-note" style="margin-top:10px;"><strong>' + n + ' photo' + (n === 1 ? '' : 's') + '</strong> still stored in the app' + (kb ? ' (about ' + kb + ' KB)' : '') + '.</p>' +
          '<button type="button" class="mp-btn" style="margin-top:6px;" ' + (m && m.running ? 'disabled' : '') + ' onclick="migratePhotos()">' +
            (m && m.running ? 'Moving ' + m.done + ' of ' + m.total + '…' : 'Move them to the bucket') + '</button>'
        : '<p class="mp-settings-note" style="margin-top:10px;">Every photo is in the bucket. &#10003;</p>') +
      (m && !m.running && m.failed ? '<p class="mp-recipe-warning-note">&#9888; ' + esc(m.error || 'Upload failed.') + '</p>' : '')
    );
  }
  function renderInstallSection(){
    const installed = isStandalone();
    const rows = (installReport || []).map(function(r){
      return '<div class="mp-chk-row ' + (r.ok ? 'mp-chk-ok' : 'mp-chk-bad') + '">' +
        '<span class="mp-chk-mark">' + (r.ok ? '&#10003;' : '&#10007;') + '</span>' +
        '<span class="mp-chk-label">' + r.label + '</span>' +
        (r.detail ? '<span class="mp-chk-detail">' + esc(r.detail) + '</span>' : '') +
      '</div>';
    }).join('');
    const failed = (installReport || []).filter(function(r){ return !r.ok; });
    const verdict = !installReport ? ''
      : (failed.length
          ? '<p class="mp-recipe-warning-note">&#9888; ' + failed.length + ' check' + (failed.length>1?'s':'') + ' failed. The first &#10007; above is the thing to fix.</p>'
          : '<p class="mp-settings-note"><strong>Everything the browser needs is in place.</strong> If it still refuses, the app is most likely already installed on this device — look for it on the home screen — or this browser only installs from its own menu.</p>');

    return settingsSection('install', 'Install on this device',
      (installed
        ? '<p class="mp-settings-note">You are running the installed app on this device. &#10003;</p>'
        : '<p class="mp-settings-note">' + browserInstallHint() + '</p>') +
      (!installed && deferredInstall
        ? '<button type="button" class="mp-btn" style="margin-top:10px;" onclick="installApp()">&#11015; Install app</button>'
        : '') +
      '<div class="mp-suit-row" style="margin-top:10px;">' +
        '<button type="button" class="mp-week-add" onclick="runInstallCheck()">' + (installReport ? 'Run the check again' : 'Why can\'t I install it?') + '</button>' +
      '</div>' +
      (installReport ? '<div class="mp-chk-list">' + rows + '</div>' + verdict : '')
    );
  }

  // ---------- the sign-in page ----------
  // Rendered in place of the whole app, so nothing about the family's food,
  // plan or shopping is in the page at all until someone is through the gate.
  function renderGate(){
    const root = document.getElementById('mp-root');
    if(!root) return;
    root.innerHTML = gateHtml();
    accountOpen = false;
  }
  function gateHtml(){
    if(authState === 'checking'){
      return '<div class="mp-gate" data-state="' + authState + '"><div class="mp-gate-card">' +
        '<p class="mp-eyebrow">Family kitchen</p>' +
        '<h1 class="mp-gate-title">Family meal planner</h1>' +
        '<p class="mp-gate-note">' + esc(authMessage || 'Checking who you are…') + '</p>' +
      '</div></div>';
    }
    if(authState === 'denied'){
      return '<div class="mp-gate" data-state="' + authState + '"><div class="mp-gate-card">' +
        '<p class="mp-eyebrow">Family kitchen</p>' +
        '<h1 class="mp-gate-title">Not your planner</h1>' +
        '<p class="mp-gate-note">You are signed in as <strong>' + esc(myEmail()) + '</strong>, but that account is not on the list of people who can open this planner.</p>' +
        '<p class="mp-gate-note mp-gate-dim">Whoever set the planner up can add you under Settings → Who can open this planner.</p>' +
        '<button type="button" class="mp-gate-btn mp-gate-ghost" onclick="signOut()">Sign in as someone else</button>' +
      '</div></div>';
    }
    if(authState === 'error'){
      return '<div class="mp-gate" data-state="' + authState + '"><div class="mp-gate-card">' +
        '<p class="mp-eyebrow">Family kitchen</p>' +
        '<h1 class="mp-gate-title">Something went wrong</h1>' +
        '<p class="mp-gate-note">' + esc(authMessage || 'The planner could not be opened.') + '</p>' +
        '<button type="button" class="mp-gate-btn" onclick="location.reload()">Try again</button>' +
        '<button type="button" class="mp-gate-btn mp-gate-ghost" onclick="signOut()">Sign out</button>' +
      '</div></div>';
    }
    // signed out
    const problem = authMessage && !/signed out/i.test(authMessage);
    return '<div class="mp-gate" data-state="' + authState + '"><div class="mp-gate-card">' +
      '<p class="mp-eyebrow">Family kitchen</p>' +
      '<h1 class="mp-gate-title">Family meal planner</h1>' +
      '<p class="mp-gate-note">Your recipes, your week and your shopping list. Sign in with the Google account that has been given access.</p>' +
      '<button type="button" class="mp-gate-btn" onclick="startGoogleLogin()">Continue with Google</button>' +
      (problem ? '<p class="mp-gate-problem">' + esc(authMessage) + '</p>'
               : (authMessage ? '<p class="mp-gate-note mp-gate-dim">' + esc(authMessage) + '</p>' : '')) +
      '<p class="mp-gate-note mp-gate-dim">Signing in needs a connection. Once you are in, the planner keeps working offline.</p>' +
    '</div></div>';
  }

  // ---------- the account chip in the header ----------
  function openAccount(){ accountOpen = true; rerender(); }
  function closeAccount(){ accountOpen = false; rerender(); }
  function accountInitial(){
    const n = (session && session.name) || myEmail();
    return (String(n).trim().charAt(0) || '?').toUpperCase();
  }
  function renderAccountPopup(){
    if(!accountOpen || !signedIn()) return '';
    const s = session;
    return '<div class="mp-modal-backdrop mp-backdrop-top" onclick="closeAccount()">' +
      '<div class="mp-modal-card mp-account-card" onclick="event.stopPropagation()">' +
        '<p class="mp-modal-title">Signed in</p>' +
        '<div class="mp-account-row">' +
          '<span class="mp-account-avatar">' + esc(accountInitial()) + '</span>' +
          '<span class="mp-account-who">' +
            (s.name ? '<strong>' + esc(s.name) + '</strong>' : '') +
            '<span class="mp-account-email">' + esc(myEmail()) + '</span>' +
          '</span>' +
        '</div>' +
        (accessMode === 'open'
          ? '<p class="mp-recipe-warning-note">&#9888; Access is not being enforced yet — anyone with the link can still open this planner. Settings → Who can open this planner explains what is left to do.</p>'
          : '') +
        '<div class="mp-suit-row mp-account-actions">' +
          '<button type="button" class="mp-week-add" onclick="closeAccount()">Close</button>' +
          '<button type="button" class="mp-reset-btn" onclick="signOut()">Sign out</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // ---------- Settings: who can open this planner ----------
  function renderAccessSection(){
    const mine = myEmail();
    const rows = members.length
      ? '<div class="mp-cat-list">' + members.map(function(m){
          const email = String(m.email || '').trim().toLowerCase();
          const isMe = email === mine;
          const pk = 'member:' + email;
          return '<div class="mp-cat-row mp-course-row">' +
            '<span class="mp-rule-text">' + esc(email) +
              (m.label ? ' <span class="mp-cat-count">' + esc(m.label) + '</span>' : '') +
              (isMe ? ' <span class="mp-cat-count">you</span>' : '') + '</span>' +
            (isMe ? '' : '<button type="button" class="mp-icon-btn ' + (pendingDelete === pk ? 'mp-confirm' : '') + '" data-email="' + esc(email) + '" onclick="removeMember(this)">' + (pendingDelete === pk ? 'Sure?' : '&times;') + '</button>') +
          '</div>';
        }).join('') + '</div>'
      : '<p class="mp-empty-mini">Nobody on the list yet.</p>';

    const body = (accessMode === 'enforced')
      ? '<p class="mp-settings-note">Only these Google accounts can open the planner. The list is enforced by Supabase itself, not by this page, so a removed address loses access everywhere.</p>' +
        rows +
        '<div class="mp-settings-row" style="margin-top:12px;">' +
          '<label class="mp-ing-field"><span>Google address</span>' +
            '<input type="email" id="member-email" placeholder="name@gmail.com" autocapitalize="none" autocorrect="off" spellcheck="false"></label>' +
          '<label class="mp-ing-field"><span>Who they are (optional)</span>' +
            '<input type="text" id="member-label" placeholder="Alice"></label>' +
        '</div>' +
        '<button type="button" class="mp-week-add" style="margin-top:10px;" onclick="addMember()">+ Give access</button>' +
        '<p class="mp-settings-note" style="margin-top:10px;">They need to sign in with that exact Google address. You cannot remove your own, so there is always a way back in.</p>'
      : '<p class="mp-recipe-warning-note">&#9888; Access is not enforced yet. Anyone with the link can still open and change this planner.</p>' +
        '<p class="mp-settings-note">Signing in works, but the <code class="mp-code">planner_members</code> table does not exist, so there is no list to check against. Run the second block of SQL from the setup notes in Supabase → SQL Editor, then reload this page.</p>';

    return settingsSection('access', 'Who can open this planner', body);
  }

  function renderActiveTab(){
    if(state.activeTab === 'ingredients') return renderIngredientsTab();
    if(state.activeTab === 'recipes') return renderRecipesTab();
    if(state.activeTab === 'shopping') return renderShoppingTab();
    if(state.activeTab === 'settings') return renderSettingsTab();
    return renderPlannerTab();
  }
  function renderApp(){
    const root = document.getElementById('mp-root');
    root.innerHTML = '<div class="mp-topbar">' + renderHeader() + renderTabs() + '</div>' + renderConflictBanner() + renderToast() + '<main class="mp-main">' + renderActiveTab() + '</main>' + renderFooter() + renderDayMealAddPopup() + renderClearWeekPopup() + renderAddNutrientPopup() + renderManagePeoplePopup() + renderRecipeModal() + renderCookViewModal() + renderNewWeekModal() + renderReplacePicker() + renderMealReplacePicker() + renderRuleEditor() + renderImportModal() + renderStepsImportModal() + renderUsdaModal() + renderRecipeFileModal() + renderIngredientEditorPopup() + renderIngredientTranslatePopup() + renderAccountPopup() + renderCalendarPopup();
    try { initSlides(); } catch(e){}
  }

  async function boot(tries){
    tries = tries || 0;
    authState = 'checking';
    renderGate();
    // A redirect back from Google carries either a one-time code or the tokens
    // themselves. Consume it before looking at what was stored last time.
    await completeLoginFromUrl();
    restoreSession();
    if(!signedIn()){ authState = 'out'; renderGate(); return; }
    if(!await ensureFreshToken()){
      saveSession(null);
      authState = 'out';
      authMessage = 'Your sign-in has expired. Please sign in again.';
      renderGate();
      return;
    }
    const verdict = await loadMembers();
    if(verdict === 'expired'){
      if(tries < 1 && await refreshSession()){ return boot(tries + 1); }
      saveSession(null);
      authState = 'out';
      authMessage = 'Your sign-in has expired. Please sign in again.';
      renderGate();
      return;
    }
    if(verdict === 'denied'){ authState = 'denied'; renderGate(); return; }
    authState = 'in';
    authMessage = '';
    scheduleTokenRefresh();
    await loadState();
    renderApp();
    autoSizeRecipeNames();
  }
  // Coming back to the app after hours — a phone waking up, a PWA reopened —
  // leaves a long-dead token behind. Renew it before the next save tries.
  // Two thresholds, so a page that sits exactly on the line does not flicker
  // between tall and slim as it settles.
  let slimPending = false;
  function onScrollShrink(){
    if(slimPending) return;
    slimPending = true;
    requestAnimationFrame(function(){
      slimPending = false;
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const on = document.body.classList.contains('mp-scrolled');
      if(!on && y > 44) document.body.classList.add('mp-scrolled');
      else if(on && y < 18) document.body.classList.remove('mp-scrolled');
    });
  }
  window.addEventListener('scroll', onScrollShrink, {passive: true});

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible' || authState !== 'in') return;
    if(tokenExpired(120000)) refreshSession().then(function(){ scheduleTokenRefresh(); });
  });
  boot();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function (err) {
      console.error('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
